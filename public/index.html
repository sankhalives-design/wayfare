/* ====================== §9 GEOGRAPHY (no map tiles) ======================
   No Google Maps JS, no API key, no billing. Coordinates come from Gemini
   (and are stored per activity), and we turn them into the thing that
   actually matters when planning a day: how long it takes to get from one
   stop to the next, and whether that fits the gap you left.
   Navigation itself hands off to Google Maps links, which need no key.
   ======================================================================== */
const Geo = {
  valid(p){ return !!p && typeof p.lat === 'number' && typeof p.lng === 'number'
      && isFinite(p.lat) && isFinite(p.lng)
      && Math.abs(p.lat) <= 90 && Math.abs(p.lng) <= 180
      && !(p.lat === 0 && p.lng === 0); },

  /* great-circle distance in km */
  km(a, b){
    const R = 6371, rad = d => d * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const h = Math.sin(dLat/2)**2 +
              Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  },

  /* Straight-line distance underestimates real routes, so apply a detour
     factor, then a speed band. Deliberately rough — it is a sanity check,
     not a routing engine. */
  estimate(straightKm){
    const km = straightKm * 1.3;
    if(km < 0.15) return {mins:0, mode:'', km};
    if(km <= 1.5)  return {mins: Math.max(3, Math.round(km / 4.8 * 60) + 2), mode:'walk', km};
    if(km <= 10)   return {mins: Math.round(km / 16 * 60) + 8,               mode:'ride', km};
    if(km <= 60)   return {mins: Math.round(km / 40 * 60) + 10,              mode:'ride', km};
    return {mins: Math.round(km / 70 * 60) + 20, mode:'long haul', km};
  },

  /* travel between two consecutive activities, or null if we cannot tell */
  hop(from, to){
    if(!this.valid(from.place) || !this.valid(to.place)) return null;
    const est = this.estimate(this.km(from.place, to.place));
    if(!est.mins) return null;
    const gap = T.toMin(to.start) - T.toMin(from.end);
    return Object.assign(est, {
      gap,
      tight: gap >= 0 && gap < est.mins,
      impossible: gap < 0
    });
  },

  label(h){
    const dist = h.km < 1 ? Math.round(h.km * 1000) + ' m' : h.km.toFixed(1) + ' km';
    const mode = h.mode === 'walk' ? 'walk' : h.mode === 'ride' ? 'ride' : h.mode;
    return '~' + h.mins + ' min ' + mode + ' · ' + dist;
  },

  /* how much of the day is spent in transit */
  dayTotals(acts){
    let km = 0, mins = 0, pins = 0, tight = 0;
    acts.forEach((a,i)=>{
      if(this.valid(a.place)) pins++;
      const n = acts[i+1];
      if(!n) return;
      const h = this.hop(a, n);
      if(h){ km += h.km; mins += h.mins; if(h.tight || h.impossible) tight++; }
    });
    return {km, mins, pins, tight};
  }
};

/* ======================= PLACE LOOKUP (keyless) ==========================
   Search-as-you-type backed by Photon, an open geocoder over OpenStreetMap
   data. Chosen because it needs no API key and no billing account, and
   because it is explicitly built for autocomplete.

   Why not the obvious two:
     * Google Places autocomplete requires a Maps key with billing enabled.
     * Nominatim (OSM's own) forbids client-side autocomplete outright.

   Everything degrades to plain typing: if the lookup is slow, blocked or
   down, the field still accepts free text and the trip still works — you
   just lose the coordinates, and with them the travel-time estimates.
   ======================================================================== */
const Places = {
  ENDPOINT: 'https://photon.komoot.io/api/',
  cache: new Map(),
  reachable: null,          // null = untested, false = blocked/offline

  async search(q, opts = {}){
    q = String(q || '').trim();
    if(q.length < 3) return [];
    const ck = q.toLowerCase() + '|' + (opts.layer || '') + '|' + (opts.near ? 1 : 0);
    if(this.cache.has(ck)) return this.cache.get(ck);

    const u = new URL(this.ENDPOINT);
    u.searchParams.set('q', q);
    u.searchParams.set('limit', String(opts.limit || 6));
    if(opts.layer) u.searchParams.set('layer', opts.layer);
    if(opts.near && Geo.valid(opts.near)){
      u.searchParams.set('lat', opts.near.lat);
      u.searchParams.set('lon', opts.near.lng);
    }
    let r;
    try{
      r = await fetch(u.toString(), {signal: opts.signal});
    }catch(e){
      if(e.name === 'AbortError') throw e;
      this.reachable = false;
      throw new Error('LOOKUP_UNAVAILABLE');
    }
    if(!r.ok){ this.reachable = false; throw new Error('LOOKUP_HTTP_' + r.status); }
    const j = await r.json();
    const out = (j.features || []).map(f => this.toPlace(f)).filter(Boolean);
    this.reachable = true;
    this.cache.set(ck, out);
    return out;
  },

  toPlace(f){
    const p = f.properties || {}, c = (f.geometry || {}).coordinates || [];
    const lng = c[0], lat = c[1];
    if(typeof lat !== 'number' || typeof lng !== 'number') return null;
    const town = p.city || p.town || p.village || p.municipality || '';
    const street = [p.housenumber, p.street].filter(Boolean).join(' ');
    const head = p.name || street || town || p.state || p.country || '';
    const tail = [street && p.name ? street : '', p.district, town, p.state, p.country]
      .filter(Boolean).filter((v, i, a) => a.indexOf(v) === i && v !== head);
    return {
      head, sub: tail.join(', '),
      label: [head].concat(tail).filter(Boolean).join(', '),
      city: town || (p.type === 'city' ? p.name : '') || p.name || '',
      state: p.state || '', country: p.country || '',
      lat, lng
    };
  }
};

/* Wire an <input data-place="..."> up to the lookup. Called from afterRender,
   so it survives the app's full re-renders without losing what you typed. */
function bindPlaceInputs(scope){
  $$('[data-place]', scope || document).forEach(input => {
    if(input._placeBound) return;
    input._placeBound = true;

    const field = input.closest('.place-field');
    const menu  = field && field.querySelector('.place-menu');
    const note  = field && field.querySelector('.place-note');
    if(!menu) return;
    let items = [], sel = -1, timer = null, ctrl = null, lastQuery = '';

    const close = () => { menu.classList.add('hidden'); menu.innerHTML = ''; items = []; sel = -1; };

    const paint = () => {
      if(!items.length){ close(); return; }
      menu.innerHTML = items.map((p, i) =>
        `<div class="place-opt ${i === sel ? 'sel' : ''}" data-i="${i}">
           <span class="pin">📍</span>
           <span style="min-width:0"><b>${esc(p.head)}</b><span>${esc(p.sub)}</span></span>
         </div>`).join('') +
        `<div class="place-foot">Results from OpenStreetMap via Photon</div>`;
      menu.classList.remove('hidden');
    };

    const choose = (i) => {
      const p = items[i];
      if(!p) return;
      input.value = p.label;
      input._picked = p;
      close();
      if(note){ note.className = 'place-note ok'; note.textContent = '✓ ' + p.label; }
      input.dispatchEvent(new CustomEvent('place:picked', {detail: p, bubbles: true}));
    };

    const run = async () => {
      const q = input.value.trim();
      if(q === lastQuery) return;
      lastQuery = q;
      if(q.length < 3){ close(); return; }
      if(ctrl) try{ ctrl.abort(); }catch(e){}
      ctrl = new AbortController();
      try{
        items = await Places.search(q, {
          layer: input.dataset.placeLayer || '',
          near: input.dataset.placeNear ? JSON.parse(input.dataset.placeNear) : null,
          signal: ctrl.signal
        });
        sel = -1;
        paint();
        if(note && !items.length){ note.className = 'place-note'; note.textContent = 'No match — you can just type it in.'; }
      }catch(e){
        if(e.name === 'AbortError') return;
        close();
        if(note){ note.className = 'place-note warn';
          note.textContent = 'Lookup unavailable — typing it in by hand works fine.'; }
      }
    };

    input.addEventListener('input', () => {
      input._picked = null;
      if(note && input.value.trim().length < 3){ note.className = 'place-note'; note.textContent = ''; }
      clearTimeout(timer);
      timer = setTimeout(run, 350);          // debounce: be polite to a free service
    });
    input.addEventListener('focus', () => { if(items.length) paint(); });
    input.addEventListener('blur', () => setTimeout(close, 180));
    input.addEventListener('keydown', (e) => {
      if(menu.classList.contains('hidden')) return;
      if(e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(sel + 1, items.length - 1); paint(); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(sel - 1, 0); paint(); }
      else if(e.key === 'Enter'){ if(sel >= 0){ e.preventDefault(); choose(sel); } }
      else if(e.key === 'Escape'){ close(); }
    });
    menu.addEventListener('mousedown', (e) => {
      const opt = e.target.closest('.place-opt');
      if(opt){ e.preventDefault(); choose(+opt.dataset.i); }
    });
  });
}

/* ============================ §10 EVENTS ================================= */
function readSetupStep(){
  const d = App.draft, step = App.setupStep;
  const g = s => $(s)?.value ?? '';
  if(step===0){
    const destEl = $('#f-dest'), stayEl = $('#f-stay');
    const dp = destEl && destEl._picked, sp = stayEl && stayEl._picked;
    const destText = destEl ? destEl.value.trim() : '';
    const stayText = stayEl ? stayEl.value.trim() : '';

    if(dp){                                   // chosen from the list: we get coordinates
      d.destination.city = dp.city || dp.head;
      d.destination.country = dp.country || '';
      d.destination.label = dp.label;
      d.destination.cityLat = dp.lat; d.destination.cityLng = dp.lng;
    } else if(destText !== (d.destination.label || '')){
      // typed by hand: keep the words, drop stale coordinates
      const bits = destText.split(',').map(x=>x.trim()).filter(Boolean);
      d.destination.city = bits[0] || '';
      d.destination.country = bits.length > 1 ? bits[bits.length-1] : '';
      d.destination.label = destText;
      d.destination.cityLat = null; d.destination.cityLng = null;
    }

    if(sp){
      d.destination.stayName = sp.head;
      d.destination.stayAddress = sp.sub || sp.label;
      d.destination.stayLabel = sp.label;
      d.destination.lat = sp.lat; d.destination.lng = sp.lng;
    } else if(stayText !== (d.destination.stayLabel || '')){
      d.destination.stayName = stayText.split(',')[0].trim();
      d.destination.stayAddress = stayText;
      d.destination.stayLabel = stayText;
      d.destination.lat = null; d.destination.lng = null;
    }

    const typedName = g('#f-name').trim();
    d.name = (typedName && typedName !== 'Untitled trip')
      ? typedName
      : (d.destination.city ? d.destination.city + ' trip' : 'Untitled trip');
    d.flights.outDate  = g('#f-outDate');
    d.flights.arrTime  = g('#f-arrTime');
    d.flights.backDate = g('#f-backDate');
    d.flights.backTime = g('#f-backTime');
    d.flights.outTo = d.destination.city; d.flights.backFrom = d.destination.city;
  }
  if(step===1){
    $$('.t-going').forEach(i=>{ d.travelers[+i.dataset.i].traveling = i.value === '1'; });
    $$('.t-name').forEach(i=>{ d.travelers[+i.dataset.i].name = i.value; });
    $$('.t-kind').forEach(i=>{ d.travelers[+i.dataset.i].kind = i.value; });
    $$('.t-role').forEach(i=>{ d.travelers[+i.dataset.i].role = i.value; });
    $$('.t-notes').forEach(i=>{ d.travelers[+i.dataset.i].notes = i.value; });
    $$('.t-pass').forEach(i=>{ d.travelers[+i.dataset.i]._pw = i.value; });
    d.constraints.hasKids   = travellersOf(d).some(v=>v.kind==='child');
    d.constraints.hasSeniors = travellersOf(d).some(v=>v.kind==='senior');
  }
  if(step===2){
    const c=d.constraints;
    c.budget=g('#f-budget'); c.mobility=g('#f-mobility'); c.restDayEvery=Number(g('#f-rest'))||0;
    c.dayStart=g('#f-dayStart'); c.dayEnd=g('#f-dayEnd');
    c.mustSee=g('#f-mustSee'); c.avoid=g('#f-avoid');
    c.dietary=g('#f-dietary'); c.currency=g('#f-currency');
  }
}

function validateSetup(){
  const d=App.draft;
  if(App.setupStep===0){
    if(!d.destination.city){ toast('Where are you going?','bad'); return false; }
    if(!D.isValid(d.flights.outDate)){ toast('Arrival date is required','bad'); return false; }
    if(d.flights.backDate && !D.isValid(d.flights.backDate)){ toast('Leaving date looks wrong','bad'); return false; }
    if(d.flights.backDate && D.diff(d.flights.outDate,d.flights.backDate)<0){ toast('You leave before you arrive — check the dates','bad'); return false; }
    if(d.flights.backDate && D.diff(d.flights.outDate,d.flights.backDate)>120){ toast('That is over 120 days — check the dates','bad'); return false; }
  }
  if(App.setupStep===1){
    if(!d.travelers.length){ toast('Add at least one person','bad'); return false; }
    if(!travellersOf(d).length){ toast('At least one person has to be travelling','bad'); return false; }
  }
  return true;
}

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  const need = (a)=>{ if(!Auth.can(a)){ toast('Your role is read-only','bad'); return false; } return true; };

  switch(act){
    /* nav */
    case 'home': Modal.closeAll(); App.trip=null; App.trips=await Repo.listTrips(); App.go('home'); break;
    case 'open-trip': await App.openTrip(id); break;
    case 'go-calendar': Modal.closeAll(); App.calMode='month'; App.calModeTouched=true; App.go('calendar'); break;
    case 'go-list': Modal.closeAll(); App.calMode='list'; App.calModeTouched=true; App.go('calendar'); break;
    case 'open-day': if(id){ Modal.closeAll(); App.go('day',{dayId:id}); } break;
    case 'modal-close': Modal.close(); break;

    /* trips */
    case 'new-trip': {
      App.draft = newTrip();
      App.draft.name = '';           // blank, so the destination can name it
      App.draft.travelers = [newTraveler('Me',{role:'owner', color:PALETTE[0]})];
      App.setupStep=0; App.trip=null; Modal.closeAll(); App.go('setup'); break;
    }
    case 'edit-trip': {
      Modal.closeAll();
      App.draft = App.trip; App.setupStep=0; App.go('setup'); break;
    }
    case 'trip-menu': openTripMenu(); break;
    case 'delete-trip': {
      if(!confirm('Delete this trip and all its photos? This cannot be undone.')) return;
      await Repo.deleteTrip(App.trip.id);
      Modal.closeAll(); App.trip=null; App.trips=await Repo.listTrips(); App.go('home');
      toast('Trip deleted'); break;
    }
    case 'export-json': {
      const t=App.trip; if(!t) return;
      const photos = await PhotoStore.listTrip(t.id);
      const blob = new Blob([JSON.stringify({wayfare:1, trip:t, photos}, null, 2)], {type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download = (t.name||'trip').replace(/[^\w\- ]/g,'').trim().replace(/\s+/g,'-').toLowerCase()+'.wayfare.json';
      a.click(); URL.revokeObjectURL(a.href);
      toast('Exported','good'); break;
    }
    case 'import-trip': $('#jsonPicker').click(); break;
    case 'print': Modal.closeAll(); openPrintView(); break;
    case 'settings': Modal.closeAll(); openSettingsModal(); break;
    case 'travelers': Modal.closeAll(); openTravelersModal(); break;
    case 'logout': App.session=null; await Repo.setSession(null); App.go(App.trip?'login':'home'); break;
    case 'pick-profile': {
      const v = App.trip.travelers.find(x=>x.id===id);
      if(!v.passHash){
        App.session={tripId:App.trip.id, travelerId:v.id, at:Date.now()};
        await Repo.setSession(App.session);
        App.calMonth = D.monthKey(App.trip.days[0]?.date||D.today());
        if(!App.trip.days.length){ App.draft = App.trip; App.setupStep = 0; }
        App.go(App.trip.days.length?'calendar':'setup');
      } else {
        Modal.open({title:`Sign in as ${esc(v.name)}`, narrow:true,
          body:`<div class="field"><label>Password</label><input type="password" id="pw-in" autofocus></div>`,
          footer:`<div class="spacer"></div><button class="btn" data-act="modal-close">Cancel</button>
            <button class="btn primary" data-act="do-login" data-id="${v.id}">Sign in</button>`,
          onMount(m){ m.querySelector('#pw-in').addEventListener('keydown', ev=>{
            if(ev.key==='Enter') m.querySelector('[data-act="do-login"]').click(); }); }});
      }
      break;
    }
    case 'do-login': {
      const v = App.trip.travelers.find(x=>x.id===id);
      const pw = $('#pw-in')?.value||'';
      if(await Auth.check(v, pw)){
        App.session={tripId:App.trip.id, travelerId:v.id, at:Date.now()};
        await Repo.setSession(App.session);
        Modal.close();
        App.calMonth = D.monthKey(App.trip.days[0]?.date||D.today());
        if(!App.trip.days.length){ App.draft = App.trip; App.setupStep = 0; }
        App.go(App.trip.days.length?'calendar':'setup');
        toast(`Welcome back, ${v.name.split(' ')[0]}`,'good');
      } else toast('Wrong password','bad');
      break;
    }

    /* setup wizard */
    case 'setup-next': readSetupStep(); if(!validateSetup()) return; App.setupStep++; render(); break;
    case 'setup-back':
      if(App.setupStep===0){ App.draft=null; App.trips=await Repo.listTrips(); App.go(App.trip?'calendar':'home'); }
      else { readSetupStep(); App.setupStep--; render(); }
      break;
    case 'setup-generate': readSetupStep(); await commitDraft(true); break;
    case 'setup-blank': readSetupStep(); await commitDraft(false); break;
    case 'draft-add-traveler': readSetupStep();
      App.draft.travelers.push(newTraveler('', {color:PALETTE[App.draft.travelers.length%PALETTE.length]})); render(); break;
    case 'draft-add-collaborator': readSetupStep();
      App.draft.travelers.push(newTraveler('', {traveling:false, color:PALETTE[App.draft.travelers.length%PALETTE.length]})); render(); break;
    case 'draft-del-traveler': readSetupStep(); App.draft.travelers.splice(+el.dataset.i,1); render(); break;
    case 'set-pace': readSetupStep(); App.draft.constraints.pace = el.dataset.v; render(); break;
    case 'toggle-interest': {
      readSetupStep();
      const v = el.dataset.v, list = App.draft.constraints.interests;
      const i = list.indexOf(v); if(i>=0) list.splice(i,1); else list.push(v);
      el.classList.toggle('on'); break;
    }

    /* day + activities */
    case 'add-activity': if(!need('edit')) return; openActivityModal(null); break;
    case 'edit-activity': if(!need('edit')) return; openActivityModal(id); break;
    case 'modal-save-activity': await saveActivityFromModal(id||null); break;
    case 'modal-del-activity': {
      const day=App.day(); day.activities = day.activities.filter(a=>a.id!==id);
      day.summary=summaryFor(day); Modal.close(); await App.saveAndRender(); toast('Deleted'); break;
    }
    case 'del-activity': {
      if(!need('edit')) return;
      const day=App.day(); const a=day.activities.find(x=>x.id===id);
      if(!confirm(`Delete "${a.title}"?`)) return;
      day.activities = day.activities.filter(x=>x.id!==id);
      day.summary=summaryFor(day); logAction(App.trip,'delete-item',a.title);
      await App.saveAndRender(); break;
    }
    case 'dup-activity': {
      if(!need('edit')) return;
      const day=App.day(); const a=day.activities.find(x=>x.id===id);
      const c=JSON.parse(JSON.stringify(a)); c.id=uid('act'); c.title=a.title+' (copy)';
      c.start=T.add(a.end,15); c.end=T.add(c.start, T.dur(a.start,a.end)||60); c.photos=[]; c.comments=[]; c.done=false;
      day.activities.push(c); day.activities.sort((x,y)=>T.toMin(x.start)-T.toMin(y.start));
      await App.saveAndRender(); toast('Duplicated','good'); break;
    }
    case 'toggle-done': {
      if(!need('edit')) return;
      const a=App.day().activities.find(x=>x.id===id); a.done=!a.done; await App.saveAndRender(); break;
    }
    case 'edit-day': if(!need('edit')) return; openDayModal(); break;
    case 'modal-save-day': {
      const day=App.day();
      day.title=$('#d-title').value; day.archetype=$('#d-arch').value;
      day.instructions=$('#d-instr').value; day.summary=$('#d-summary').value;
      Modal.close(); await App.saveAndRender(); toast('Day updated','good'); break;
    }
    case 'clear-day': {
      if(!need('edit')) return;
      if(!confirm('Remove every item from this day? Photos and comments on the day stay.')) return;
      const day=App.day(); day.activities=[]; day.summary=''; day.title=day.title||'Open day';
      logAction(App.trip,'clear-day',D.fmt(day.date,'short'));
      await App.saveAndRender(); break;
    }
    case 'copy-day': if(!need('edit')) return; openCopyModal('to'); break;
    case 'copy-day-from': if(!need('edit')) return; openCopyModal('from'); break;
    case 'modal-do-copy': await doCopy(el.dataset.dir); break;
    case 'rebuild': {
      Modal.closeAll();
      if(App.trip.days.length && !confirm('Regenerate wipes the current plan items (photos and comments on days are kept). Continue?')) return;
      App.draft = App.trip; App.setupStep=0; App.go('setup'); break;
    }

    /* media + comments */
    case 'add-day-photo': if(!need('edit')) return; pickPhotos({kind:'day'}); break;
    case 'add-act-photo': if(!need('edit')) return; pickPhotos({kind:'activity', id}); break;
    case 'del-photo': {
      e.stopPropagation(); if(!need('edit')) return;
      const day=App.day(); day.photos = day.photos.filter(p=>p!==id);
      await PhotoStore.del(id); await App.saveAndRender(); break;
    }
    case 'del-act-photo': {
      e.stopPropagation(); if(!need('edit')) return;
      const a=App.day().activities.find(x=>x.id===el.dataset.actid);
      a.photos=a.photos.filter(p=>p!==id); await PhotoStore.del(id);
      Modal.close(); await App.saveAndRender(); break;
    }
    case 'view-photo': if(!e.target.closest('.x')) await openPhotoViewer(id); break;
    case 'act-photos': openActivityMediaModal(id,'photos'); break;
    case 'act-comments': openActivityMediaModal(id,'comments'); break;
    case 'am-tab': {
      const host=$('#amBody'); const a=App.day().activities.find(x=>x.id===host.dataset.actid);
      el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); el.classList.add('on');
      host.innerHTML = el.dataset.tab==='photos'?amPhotos(a):amComments(a);
      hydratePhotos(host); break;
    }
    case 'post-comment': {
      const txt=$('#newComment')?.value.trim(); if(!txt) return;
      const day = App.day();
      const comment = {id:uid('c'), by:App.me()?.id, text:txt, at:Date.now()};
      logAction(App.trip,'comment',D.fmt(day.date,'short'));
      /* On a shared trip, comments go up their own append-only route. They can
         then never lose a race with someone editing the same day — which is
         the most likely thing to happen while people are talking about it. */
      if(Cloud.on(App.trip)){
        day.comments.push(comment);
        render();
        await Cloud.comment(App.trip, day.id, comment);
        render();
      } else {
        day.comments.push(comment);
        await App.saveAndRender();
      }
      break;
    }
    case 'post-act-comment': {
      const txt=$('#newActComment')?.value.trim(); if(!txt) return;
      const a=App.day().activities.find(x=>x.id===id);
      a.comments.push({id:uid('c'), by:App.me()?.id, text:txt, at:Date.now()});
      await App.save(); $('#amBody').innerHTML = amComments(a); render(); openActivityMediaModal(id,'comments'); break;
    }
    case 'del-comment': {
      const day=App.day(); day.comments = day.comments.filter(c=>c.id!==id);
      await App.saveAndRender(); break;
    }
    case 'share-place': {
      const a=App.day().activities.find(x=>x.id===id);
      const url = mapsSearchUrl(a.place.address||a.place.name);
      const text = `${a.title} — ${a.place.name||a.place.address}\n${D.fmt(App.day().date,'dow')} ${T.fmt(a.start)}\n${url}`;
      if(navigator.share){ try{ await navigator.share({title:a.title, text, url}); break; }catch(err){} }
      try{ await navigator.clipboard.writeText(text); toast('Location copied to clipboard','good'); }
      catch(err){ window.open(url,'_blank'); }
      break;
    }

    /* travellers modal */
    case 'modal-add-traveler': {
      App.trip.travelers.push(newTraveler('New traveller',{color:PALETTE[App.trip.travelers.length%PALETTE.length]}));
      await App.save(); Modal.close(); openTravelersModal(); break;
    }
    case 'modal-add-collaborator': {
      App.trip.travelers.push(newTraveler('New collaborator',
        {traveling:false, role:'editor', color:PALETTE[App.trip.travelers.length%PALETTE.length]}));
      await App.save(); Modal.close(); openTravelersModal(); break;
    }
    case 'modal-del-traveler': {
      const victim = App.trip.travelers.find(v=>v.id===id);
      if(victim && victim.traveling !== false && travellersOf(App.trip).length < 2)
        return toast('Keep at least one traveller','bad');
      App.trip.travelers = App.trip.travelers.filter(v=>v.id!==id);
      await App.save(); Modal.close(); openTravelersModal(); break;
    }
    case 'modal-save-travelers': {
      /* Read everything first, validate, and only then write. Mutating as we
         go meant a rejected save still left the trip in the bad state. */
      const pending = [];
      for(const r of $$('#travBody tr')){
        const person = App.trip.travelers.find(x=>x.id===r.dataset.id);
        if(!person) continue;                       // section header row
        pending.push({
          person,
          name:      r.querySelector('.v-name').value || person.name,
          traveling: r.querySelector('.v-going').value === '1',
          kind:      r.querySelector('.v-kind').value,
          role:      r.querySelector('.v-role').value,
          notes:     r.querySelector('.v-notes').value,
          pw:        r.querySelector('.v-pass').value
        });
      }
      if(pending.length && !pending.some(x=>x.traveling)){
        toast('At least one person has to be travelling','bad');
        return;                                     // nothing written
      }
      for(const x of pending){
        Object.assign(x.person, {name:x.name, traveling:x.traveling,
                                 kind:x.kind, role:x.role, notes:x.notes});
        if(x.pw) await Auth.setPassword(x.person, x.pw);
      }
      App.trip.constraints.hasKids    = travellersOf(App.trip).some(v=>v.kind==='child');
      App.trip.constraints.hasSeniors = travellersOf(App.trip).some(v=>v.kind==='senior');
      logAction(App.trip,'people', travellersOf(App.trip).length + ' travelling, ' +
                collaboratorsOf(App.trip).length + ' helping');
      Modal.close(); await App.saveAndRender(); toast('People saved','good'); break;
    }

    /* settings modal */
    case 'modal-save-settings': {
          await Repo.setSettings(App.settings);
      Modal.close(); render(); toast('Settings saved','good'); break;
    }
  }
});

/* ============================================================================
   §12  GEMINI INTEGRATION
   Google's API sends no CORS headers, so the browser cannot call it directly.
   wayfare-server.py serves this file AND proxies /gapi/* to Google, adding the
   headers and streaming SSE straight through.

   Paths, in order of preference:
     (a) Local server  — one-click, streaming, free Gemini tier
     (b) Paste bridge  — no server at all: copy prompt into gemini.google.com,
                         paste the JSON back
     (c) Offline rules — the §5 template engine, no network
   Everything below the transport layer (prompts, parsing, applying) is
   provider-agnostic; swapping in another API means rewriting only AI.call().
   ========================================================================== */
const WAYFARE_VERSION = '2.0';
/* No key ships in this file. If the server holds one (see /wayfare-health)
   the browser never sees a key at all; otherwise a person can paste their own
   into Settings and it stays on their device. */
const BUILT_IN_KEY = '';
const KEY_IS_BUILT_IN = false;
const BUILD_STAMP = String(window.WAYFARE_BUILD || '').trim();
const AI = {
  GOOGLE: 'https://generativelanguage.googleapis.com',
  server: null,               // /wayfare-health payload when the proxy is up
  foundBase: null,            // origin the server was actually discovered on
  probed: false,              // has probe() run at least once?
  probeLog: [],               // what each candidate answered (Diagnostics panel)
  directOK: null,             // true once a straight browser->Google call works
  directNote: '',
  transport: 'none',          // direct | proxy | none
  DEFAULT_MODEL: 'gemini-2.5-flash',
  PORTS: ['8000','8001','8002','8080','8888','5000','3000'],

  /* Google DOES allow browser calls (its own JS SDK runs client-side), so try
     that first and skip the local server entirely. The server stays as a
     fallback for locked-down browsers, file:// origins Google may refuse, and
     for keeping the key off the page. */
  async probeDirect(){
    try{
      const h = {};
      const k = this.effectiveKey();
      if(k) h['x-goog-api-key'] = k;
      const r = await fetch(this.GOOGLE + '/v1beta/models?pageSize=1', {headers:h});
      // ANY http response proves CORS let us through, even 401/403
      this.directOK = true;
      this.directNote = 'browser reached Google directly (HTTP ' + r.status + ')';
      return true;
    }catch(e){
      this.directOK = false;
      this.directNote = 'blocked: ' + (e && e.message ? e.message : 'network error')
        + (this.isFileProtocol() ? ' (page opened from disk, origin is "null")' : '');
      return false;
    }
  },

  apiRoot(){ return this.transport === 'direct' ? this.GOOGLE : this.apiBase(); },

  /* The page may be served by the server, opened from disk, or on another port.
     Rather than assume same-origin, try every plausible origin. The server
     sends Access-Control-Allow-Origin:* plus the private-network header, so
     even a file:// page can reach it. */
  candidates(){
    const out = [];
    const cfg = String(App.settings.proxyBase||'').replace(/\/+$/,'');
    if(cfg) out.push(cfg);
    if(this.foundBase) out.push(this.foundBase);
    if(location.protocol !== 'file:') out.push('');            // same origin
    this.PORTS.forEach(p=>out.push('http://localhost:'+p));
    this.PORTS.forEach(p=>out.push('http://127.0.0.1:'+p));
    return out.filter((v,i,a)=>a.indexOf(v)===i);
  },

  serverBase(){
    if(this.foundBase !== null) return this.foundBase;
    return String(App.settings.proxyBase||'').replace(/\/+$/,'');
  },
  apiBase(){ return this.serverBase() + '/gapi'; },
  healthUrl(){ return this.serverBase() + '/wayfare-health'; },
  isFileProtocol(){ return location.protocol === 'file:'; },
  isHttps(){ return location.protocol === 'https:'; },
  /* the key actually used for a request: a personally-pasted one wins, then
     the one baked into this file, then one held by the local helper */
  effectiveKey(){ return (App.settings.apiKey||'').trim() || BUILT_IN_KEY; },
  hasKey(){ return !!this.effectiveKey() || !!(this.server && this.server.hasServerKey); },
  /* direct calls need a key in the browser; the proxy can supply its own */
  keyForTransport(){
    if(this.transport === 'direct') return !!this.effectiveKey();
    if(this.transport === 'proxy')  return this.hasKey();
    return false;
  },
  ready(){ return this.transport !== 'none' && this.keyForTransport(); },

  async probeOne(base){
    const url = (base||'') + '/wayfare-health';
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) return {url, base, ok:false, note:'HTTP '+r.status+' (something else is on that port)'};
      const j = await r.json();
      if(j && j.wayfare) return {url, base, ok:true, note:'Wayfare v'+(j.version||'?'), health:j};
      return {url, base, ok:false, note:'answered, but not Wayfare'};
    }catch(e){
      return {url, base, ok:false, note:'nothing listening'};
    }
  },

  async probe(){
    /* v2 order: look for a server FIRST. If it holds the key there is no
       reason to make the browser talk to Google at all, and no reason to ask
       anyone for a key. Only fall back to a direct call when no server can
       serve us — which is the case when someone opens the file locally. */
    this.probeLog = [];
    this.foundBase = null; this.server = null;
    const browserKey = !!this.effectiveKey();
    for(const base of this.candidates()){
      const r = await this.probeOne(base);
      this.probeLog.push(r);
      if(r.ok){
        this.foundBase = base;
        this.server = r.health;
        if(String(App.settings.proxyBase||'') !== base){
          App.settings.proxyBase = base;
          Repo.setSettings(App.settings);      // remember where it lives
        }
        break;
      }
      /* On a hosted site the first candidate is same-origin and that is the
         only one that can be right; do not sweep localhost ports from a
         public page. */
      if(location.protocol !== 'file:' && !App.settings.proxyBase) break;
    }

    /* A server holding its own key is always the answer: no key in the
       browser, no cross-origin call, quota and clamping enforced. */
    if(this.server && this.server.hasServerKey){
      this.transport = 'proxy';
      this.directOK = null;                 // never needed to find out
    } else {
      await this.probeDirect();
      if(this.directOK && browserKey) this.transport = 'direct';
      else if(this.server)            this.transport = 'proxy';
      else if(this.directOK)          this.transport = 'direct';
      else                            this.transport = 'none';
    }

    this.probed = true;
    return this.transport === 'none' ? null : (this.server || {direct:true});
  },

  /* ---------------------------- prompts --------------------------------- */
  systemPrompt(){
    const d = App.settings.depth||{};
    const lines = [
      'You are a meticulous local travel planner who has lived in the destination for years.',
      'You build day-by-day itineraries that are realistic about distance, opening hours, energy and jet lag.',
      '',
      'HARD RULES',
      '1. Output ONLY a single JSON object. No prose, no markdown fences, no commentary.',
      '2. Use REAL, specific, verifiable places in the destination — name them exactly as a local would,',
      '   and give a "placeAddress" precise enough to paste into Google Maps (street/district + city).',
      '   Never write placeholders like "a local museum" or "the old town".',
      '3. Respect the geography: cluster each day so stops are close together. Do not bounce across the city.',
      '4. Respect opening days and seasons. If a famous site is closed on the planned weekday, plan around it',
      '   and say so in that item\'s "instructions".',
      '5. Never invent booking references, ticket prices you cannot justify, or hotel names the user did not give.',
      '6. Every day must include realistic meal breaks and at least one genuine rest gap.',
      '7. Times are 24-hour "HH:MM", strictly increasing within a day, and must not overlap.',
      '8. Give "lat" and "lng" in decimal degrees for every place you name — approximate is fine,',
      '   but it must be the right city. Use null only when you genuinely do not know. These drive',
      '   the travel-time estimates between stops, so leave enough slack between distant stops.'
    ];
    if(d.places!==false) lines.push('9. Prefer a mix of the famous and the local — at least one non-obvious neighbourhood pick per full day.');
    if(d.tips!==false) lines.push('10. For most items, fill "instructions" with something a first-timer would not know: booking window,',
                                  '   dress code, closing day, best arrival time, cash-only, common scam, queue trick, accessibility note.');
    if(d.food) lines.push('11. Name specific eateries for meals, matched to the stated dietary needs and budget band.');
    else lines.push('11. Keep meals mostly generic ("Lunch around <area>") unless a specific place is genuinely worth the trip.');
    if(d.transport) lines.push('12. Add short "travel" items between distant stops with the mode and rough duration.');
    else lines.push('12. Do not create separate transport items between nearby stops; mention how to get there in "notes" instead.');
    return lines.join('\n');
  },

  schemaBlock(){
    return [
      'JSON SCHEMA — return exactly this shape:',
      '{',
      '  "tripTitle": "short evocative name for the trip",',
      '  "days": [',
      '    {',
      '      "date": "YYYY-MM-DD",',
      '      "title": "short title for the day",',
      '      "archetype": "arrival | explore | daytrip | rest | departure",',
      '      "summary": "one line, max 90 chars",',
      '      "instructions": "day-level heads-up: passes to buy, weather, what to carry (may be empty)",',
      '      "activities": [',
      '        {',
      '          "start": "HH:MM", "end": "HH:MM",',
      '          "type": "travel | checkin | sight | food | activity | rest | shopping | admin",',
      '          "title": "what you are doing",',
      '          "placeName": "real place name (empty for meals/rest with no fixed venue)",',
      '          "placeAddress": "street/district, city, country — Google-Maps searchable",',
      '          "lat": 35.0116, "lng": 135.7681,     // decimal degrees, null if unsure',
      '          "notes": "why this, what to expect, how to get there from the previous stop",',
      '          "instructions": "practical warning or tip (may be empty)",',
      '          "cost": "rough per-person cost as a number only, or empty string",',
      '          "assigned": ["traveller name"]',
      '        }',
      '      ]',
      '    }',
      '  ]',
      '}'
    ].join('\n');
  },

  tripContext(trip){
    const c=trip.constraints, f=trip.flights, dest=trip.destination;
    const dates = D.isValid(f.outDate) ? D.range(f.outDate, f.backDate||f.outDate) : [];
    const L=[];
    L.push('DESTINATION: ' + (dest.label || [dest.city, dest.country].filter(Boolean).join(', ')) +
      (Geo.valid({lat:dest.cityLat, lng:dest.cityLng})
        ? '  [' + dest.cityLat.toFixed(4) + ', ' + dest.cityLng.toFixed(4) + ']' : ''));
    if(dest.stayName || dest.stayAddress)
      L.push('STAYING AT: ' + (dest.stayLabel || [dest.stayName, dest.stayAddress].filter(Boolean).join(' — ')) +
             (Geo.valid(dest) ? '  [' + dest.lat.toFixed(4) + ', ' + dest.lng.toFixed(4) + ']' : '') +
             '  (all days should start and end sensibly from here)');
    L.push('');
    L.push('DATES: ' + dates.length + ' day(s) — ' + dates.map(x=>x+' ('+D.fmt(x,'dow').split(',')[0]+')').join(', '));
    L.push('ARRIVES: ' + (f.arrTime || 'around midday') + ' on ' + f.outDate +
           '. Day 1 must account for getting out of the airport, the transfer and check-in, ' +
           'and then stay deliberately light — assume travel fatigue.');
    if(f.backDate) L.push('LEAVES: ' + (f.backTime || 'evening') + ' on ' + f.backDate +
           '. Work the last day backwards from that, allowing three hours at the airport plus the transfer.');
    L.push('');
    const going = travellersOf(trip);
    L.push('TRAVELLERS (' + going.length + '):');
    going.forEach(v=>{
      L.push('  - ' + v.name + ' (' + v.kind + (v.age?', age '+v.age:'') + ')' + (v.notes? ' — ' + v.notes : ''));
    });
    /* collaborators are deliberately not listed: they are not on the trip */
    L.push('');
    L.push('PACE: ' + (PACE[c.pace]?.label||c.pace) + ' — ' +
      ({relaxed:'one main thing per day, long meals, an afternoon break, home early',
        balanced:'two main things per day plus an evening',
        packed:'three main things per day, early starts, full evenings'}[c.pace]||''));
    L.push('BUDGET: ' + ({shoe:'shoestring — free/cheap, street food, public transport',
      mid:'mid-range — a paid attraction or two a day, sit-down meals',
      lux:'generous — private guides, premium experiences fine'}[c.budget]||c.budget));
    L.push('MOBILITY: ' + ({none:'no limitations',
      limited:'limited walking — keep walking legs short, build in sitting breaks, avoid long uphill stretches',
      wheelchair:'wheelchair user — step-free routes only, verify accessibility for every venue and note it'}[c.mobility]||c.mobility));
    if(c.interests?.length) L.push('INTERESTS (weight these heavily): ' + c.interests.join(', '));
    else L.push('INTERESTS: not specified — give a well-rounded first-timer plan');
    if(c.dietary) L.push('DIETARY: ' + c.dietary);
    if(c.currency) L.push('CURRENCY for costs: ' + c.currency);
    if(c.dayStart) L.push('DAYS SHOULD START AROUND: ' + c.dayStart);
    if(c.dayEnd) L.push('DAYS SHOULD END BY: ' + c.dayEnd);
    if(Number(c.restDayEvery)>0) L.push('PACING: insert a deliberately slow day roughly every ' + c.restDayEvery + ' days.');
    if(c.hasKids) L.push('NOTE: children are travelling — no late nights, shorter museum stints, plan snack and toilet stops, prefer hands-on over passive.');
    if(c.hasSeniors) L.push('NOTE: older travellers — moderate pace, seating available, avoid long standing queues.');
    if(String(c.mustSee||'').trim()) L.push('MUST-SEE (all of these have to appear somewhere):\n  ' +
      String(c.mustSee).split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).join('\n  '));
    if(String(c.avoid||'').trim()) L.push('AVOID / CONSTRAINTS (treat as hard rules):\n  ' + String(c.avoid).trim());
    return L.join('\n');
  },

  tripPrompt(trip, extra){
    return [
      this.tripContext(trip),
      extra ? '\nEXTRA INSTRUCTIONS FROM THE TRAVELLER (highest priority):\n' + extra : '',
      '',
      'Produce the full itinerary for every date listed, in order.',
      '',
      this.schemaBlock()
    ].filter(Boolean).join('\n');
  },

  dayPrompt(trip, day, extra){
    const i = trip.days.findIndex(d=>d.id===day.id);
    const near = trip.days.filter((_,j)=>Math.abs(j-i)<=2 && j!==i)
      .map(d=>'  ' + d.date + ': ' + (d.activities.map(a=>a.title).join(' · ')||'(empty)')).join('\n');
    return [
      this.tripContext(trip),
      '',
      'REGENERATE ONE DAY ONLY: ' + day.date + ' (day ' + (i+1) + ' of ' + trip.days.length + ', ' + D.fmt(day.date,'long') + ').',
      'This is what is planned on the surrounding days — do NOT repeat any of it:',
      near || '  (nothing yet)',
      extra ? '\nWHAT THE TRAVELLER WANTS FOR THIS DAY (highest priority):\n' + extra : '',
      '',
      'Return the schema below with a "days" array containing exactly ONE day object for ' + day.date + '.',
      '',
      this.schemaBlock()
    ].filter(Boolean).join('\n');
  },

  itemPrompt(trip, day, act, extra){
    const others = day.activities.filter(a=>a.id!==act.id)
      .map(a=>'  ' + a.start + '–' + a.end + '  ' + a.title + (a.place.name?' @ '+a.place.name:'')).join('\n');
    return [
      this.tripContext(trip),
      '',
      'The traveller wants alternatives for ONE item on ' + day.date + '.',
      'Item to replace: ' + act.start + '–' + act.end + '  "' + act.title + '"' + (act.place.name?' @ '+act.place.name:''),
      'The rest of that day (must still flow, and alternatives must not duplicate these):',
      others || '  (nothing else that day)',
      extra ? '\nWHAT THEY WANT INSTEAD (highest priority):\n' + extra : '',
      '',
      'Suggest 3 genuinely different real alternatives that fit the same slot and the surrounding stops.',
      'Return ONLY: {"alternatives":[{"start":"HH:MM","end":"HH:MM","type":"...","title":"...",',
      '  "placeName":"...","placeAddress":"...","lat":0.0,"lng":0.0,',
      '  "notes":"why this one","instructions":"practical tip","cost":""}]}'
    ].filter(Boolean).join('\n');
  },

  /* ----------------------------- models ---------------------------------- */
  keyHeaders(extra){
    const h = {'content-type':'application/json'};
    const k = this.effectiveKey();
    if(k) h['x-goog-api-key'] = k;          // omitted entirely when the server holds one
    /* The server uses these for the stale-build gate, authorship and the
       per-trip generation counter. Harmless when talking to Google directly. */
    if(this.transport !== 'direct'){
      if(BUILD_STAMP) h['x-wayfare-build'] = BUILD_STAMP;
      h['x-wayfare-device'] = Repo.deviceId();
      const t = (extra && extra.tripId) || App.trip?.id || App.draft?.id;
      if(t) h['x-wayfare-trip'] = t;
    }
    return h;
  },

  async fetchModels(){
    if(this.transport==='none') throw new Error('NO_TRANSPORT');
    let r;
    try{ r = await fetch(this.apiRoot()+'/v1beta/models?pageSize=1000', {headers:this.keyHeaders()}); }
    catch(e){ throw new Error('NO_TRANSPORT'); }
    if(!r.ok){
      let msg=''; try{ msg = (await r.json())?.error?.message || ''; }catch(e){}
      throw new Error('HTTP_'+r.status+(msg?': '+msg:''));
    }
    const j = await r.json();
    const seen = new Set();
    return (j.models||[])
      .filter(m => (m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m => ({ id:String(m.name||'').replace(/^models\//,''),
                   label:m.displayName||'', out:m.outputTokenLimit||0 }))
      .filter(m => m.id && !/embedding|aqa|imagen|veo|tts|audio|image|learnlm/i.test(m.id))
      .filter(m => (seen.has(m.id) ? false : (seen.add(m.id), true)))
      .sort((a,b)=>this.modelScore(b.id)-this.modelScore(a.id));
  },

  /* newest Flash first — survives Google's frequent renames */
  modelScore(id){
    let s = 0;
    const v = parseFloat((String(id).match(/gemini-(\d+(?:\.\d+)?)/)||[])[1] || '0');
    s += v * 20;
    if(/flash/.test(id)) s += 100;
    if(/pro/.test(id))   s += 60;
    if(/lite/.test(id))  s -= 35;
    if(/preview|exp|thinking/.test(id)) s -= 25;
    if(/\d{2}-\d{2}$/.test(id)) s -= 8;            // dated snapshots below the alias
    if(/latest/.test(id)) s += 4;
    return s;
  },

  pickDefault(list){
    if(!list || !list.length) return this.DEFAULT_MODEL;
    return list[0].id;
  },

  /* --------------------------- streaming call ---------------------------- */
  async call({prompt, maxTokens, onDelta, signal}){
    if(this.transport==='none') throw new Error('NO_TRANSPORT');
    if(!this.keyForTransport()) throw new Error('NO_KEY');
    const model = (App.settings.model||'').trim() || this.DEFAULT_MODEL;
    const url = this.apiRoot() + '/v1beta/models/' + encodeURIComponent(model) +
                ':streamGenerateContent?alt=sse';
    let res;
    try{
      res = await fetch(url, {
        method:'POST', signal, headers:this.keyHeaders(),
        body: JSON.stringify({
          systemInstruction:{ parts:[{text:this.systemPrompt()}] },
          contents:[{ role:'user', parts:[{text:prompt}] }],
          generationConfig:{
            responseMimeType:'application/json',       // native JSON mode
            maxOutputTokens: maxTokens || Number(App.settings.maxTokens) || 32768,
            temperature: 1
          }
        })
      });
    }catch(err){
      if(err.name==='AbortError') throw err;
      if(this.transport==='direct'){ this.directOK = false; }
      else { this.server = null; }
      this.transport = 'none';
      throw new Error('NO_TRANSPORT');
    }
    if(!res.ok){
      let msg='', status='';
      try{ const j = await res.json(); msg = j?.error?.message||''; status = j?.error?.status||''; }catch(e){}
      /* Messages our own server writes are already written for a person —
         pass them through verbatim rather than wrapping them in jargon. */
      if(res.status === 426) throw new Error('STALE_BUILD: ' + msg);
      if(status === 'DAILY_CAP') throw new Error('DAILY_CAP: ' + msg);
      if(status === 'NO_SERVER_KEY') throw new Error('NO_SERVER_KEY: ' + msg);
      throw new Error('HTTP_'+res.status+(status?' '+status:'')+(msg?': '+msg:''));
    }

    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf='', out='', finish='', blocked='';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let nl;
      while((nl = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl+1);
        if(!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if(!payload || payload==='[DONE]') continue;
        let ev; try{ ev = JSON.parse(payload); }catch(e){ continue; }
        if(ev.error) throw new Error('HTTP_'+(ev.error.code||500)+': '+(ev.error.message||'stream error'));
        if(ev.promptFeedback?.blockReason) blocked = ev.promptFeedback.blockReason;
        const cand = (ev.candidates||[])[0];
        if(cand){
          if(cand.finishReason) finish = cand.finishReason;
          const parts = cand.content?.parts || [];
          for(const p of parts){ if(typeof p.text==='string'){ out += p.text; } }
          if(parts.length && onDelta) onDelta(out);
        }
      }
    }
    if(blocked) throw new Error('BLOCKED: '+blocked);
    if(finish === 'MAX_TOKENS') throw new Error('TRUNCATED');
    if(!out.trim()) throw new Error('EMPTY'+(finish?': finishReason '+finish:''));
    return out;
  },

  friendlyError(err){
    const m = String(err.message||err);
    if(m==='NO_TRANSPORT' || m==='NO_SERVER'){
      const base = 'Could not reach Gemini. Your browser could not call Google directly — an ad-blocker, privacy extension, firewall or work network is the usual cause. Check the key is right, disable blockers for this page, then press Re-check.';
      return this.isHttps()
        ? base + ' The copy-paste tab always works: it needs no key and no connection of its own.'
        : base + ' You can also run the local helper — on Windows double-click "Start Wayfare.bat" in the app folder and leave the window open — or use the copy-paste tab, which needs nothing at all.';
    }
    if(m==='NO_KEY') return 'No Gemini API key yet. Get a free one at aistudio.google.com/apikey (no card needed) and paste it into Settings — or start the server with GEMINI_API_KEY=... so the key never touches the browser.';
    if(m.startsWith('STALE_BUILD')) return m.replace(/^STALE_BUILD:\s*/,'') + ' (Pull down to refresh, or close the tab and reopen the link.)';
    if(m.startsWith('DAILY_CAP')) return m.replace(/^DAILY_CAP:\s*/,'');
    if(m.startsWith('NO_SERVER_KEY')) return m.replace(/^NO_SERVER_KEY:\s*/,'');
    if(m==='TRUNCATED') return 'The plan was cut off before it finished. Raise "max output tokens" in Settings, or regenerate one day at a time.';
    if(m.startsWith('BLOCKED')) return 'Gemini blocked the request (' + m.replace('BLOCKED: ','') + '). Reword the notes or constraints and retry.';
    if(m.startsWith('EMPTY')) return 'Gemini returned nothing usable. Retry, or pick a different model in Settings. (' + m + ')';
    if(m.startsWith('HTTP_401')) return 'No API key reached the server. Paste one into Settings, or restart the server with GEMINI_API_KEY=... set.';
    if(/HTTP_400.*API[_ ]KEY|API key not valid/i.test(m)) return 'That API key was rejected. Check it at aistudio.google.com/apikey.';
    if(m.startsWith('HTTP_400')) return 'Google rejected the request: ' + m.replace(/^HTTP_400[^:]*:?\s*/,'') + ' — try another model in Settings.';
    if(m.startsWith('HTTP_403')) return 'Access denied (403). The key may be restricted, or the Generative Language API is not enabled for that project.';
    if(m.startsWith('HTTP_404')) return 'That model name does not exist for your key. Hit "Refresh model list" in Settings and pick one from the dropdown.';
    if(m.startsWith('HTTP_429')) return 'Free-tier quota hit (requests per minute or per day). Wait a minute, switch to a Flash-Lite model, or try again tomorrow.';
    if(m.startsWith('HTTP_5')||m.startsWith('HTTP_502')) return 'Google returned a server error. Retry in a minute.';
    return m;
  },

  /* ---------------------------- parsing ---------------------------------- */
  extractJSON(text){
    let s = String(text||'').trim();
    s = s.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
    const i = s.indexOf('{');
    if(i < 0) throw new Error('No JSON object found in the response.');
    let depth=0, inStr=false, esc=false, end=-1;
    for(let j=i; j<s.length; j++){
      const ch = s[j];
      if(inStr){ if(esc) esc=false; else if(ch==='\\') esc=true; else if(ch==='"') inStr=false; continue; }
      if(ch==='"'){ inStr=true; continue; }
      if(ch==='{') depth++;
      else if(ch==='}'){ depth--; if(depth===0){ end=j+1; break; } }
    }
    if(end < 0) throw new Error('TRUNCATED');
    return JSON.parse(s.slice(i, end));
  },

  /* --------------------------- applying ---------------------------------- */
  normType(t){ t=String(t||'').toLowerCase().trim(); return ACT_TYPES[t] ? t : 'activity'; },
  normArch(a){ a=String(a||'').toLowerCase().trim();
    return ['arrival','explore','daytrip','rest','departure'].includes(a) ? a : 'explore'; },
  normTime(t, fb){
    const m = String(t||'').match(/^(\d{1,2})\s*:\s*(\d{1,2})/);
    if(!m) return fb;
    const h  = Math.max(0, Math.min(23, +m[1]));
    const mi = Math.max(0, Math.min(59, +m[2]));
    return String(h).padStart(2,'0') + ':' + String(mi).padStart(2,'0');
  },

  /* accept lat/lng as numbers or numeric strings; reject anything implausible */
  coords(raw){
    const num = v => { const n = (typeof v === 'number') ? v : parseFloat(v); return isFinite(n) ? n : null; };
    let lat = num(raw.lat), lng = num(raw.lng);
    if(lat === null || lng === null ||
       Math.abs(lat) > 90 || Math.abs(lng) > 180 ||
       (lat === 0 && lng === 0)) return {lat:null, lng:null};
    return {lat, lng};
  },

  toActivity(raw, trip, fallbackStart){
    let start = this.normTime(raw.start, fallbackStart||'09:00');
    let end   = this.normTime(raw.end, null);
    if(!end || T.toMin(end) <= T.toMin(start)){
      if(T.toMin(start) + 90 <= 1439){ end = T.add(start, 90); }
      else { end = '23:59'; if(T.toMin(start) >= T.toMin(end)) start = T.fromMin(T.toMin(end) - 60); }
    }
    const names = Array.isArray(raw.assigned) ? raw.assigned : [];
    const assigned = names.map(n => travellersOf(trip).find(v =>
      v.name.toLowerCase().trim() === String(n).toLowerCase().trim())?.id).filter(Boolean);
    return newActivity({
      start, end,
      title: String(raw.title||'Untitled').slice(0,140),
      type: this.normType(raw.type),
      place: Object.assign(
        { name:String(raw.placeName||'').slice(0,140), address:String(raw.placeAddress||'').slice(0,240) },
        this.coords(raw)),
      notes: String(raw.notes||''),
      instructions: String(raw.instructions||''),
      cost: (raw.cost===0||raw.cost) ? String(raw.cost) : '',
      currency: trip.constraints.currency||'',
      assigned, source:'gemini'
    });
  },

  toDay(rawDay, date, trip, existing){
    const day = newDay(date);
    if(existing){ day.id=existing.id; day.photos=existing.photos||[]; day.comments=existing.comments||[]; }
    if(rawDay){
      day.title = String(rawDay.title||'').slice(0,120);
      day.archetype = this.normArch(rawDay.archetype);
      day.summary = String(rawDay.summary||'').slice(0,160);
      day.instructions = String(rawDay.instructions||'');
      let cursor = '08:30';
      day.activities = (rawDay.activities||[]).map(a=>{
        const act = this.toActivity(a, trip, cursor);
        cursor = T.add(act.end, 15);
        return act;
      });
      day.activities.sort((a,b)=>T.toMin(a.start)-T.toMin(b.start));
    }
    if(!day.summary) day.summary = summaryFor(day);
    return day;
  },

  applyTripPlan(trip, plan){
    const wanted = D.range(trip.flights.outDate, trip.flights.backDate||trip.flights.outDate);
    const list = Array.isArray(plan.days) ? plan.days : [];
    const byDate = {}; list.forEach(d=>{ if(d && d.date) byDate[String(d.date).slice(0,10)] = d; });
    const oldDays = trip.days || [];
    trip.days = wanted.map((date, i) => {
      const raw = byDate[date] || list[i] || null;
      return this.toDay(raw, date, trip, oldDays.find(d=>d.date===date));
    });
    if(plan.tripTitle && (!trip.name || /^untitled/i.test(trip.name))) trip.name = String(plan.tripTitle).slice(0,80);
    const filled = trip.days.filter(d=>d.activities.length).length;
    return {days:trip.days.length, filled};
  },

  applyDayPlan(trip, day, plan){
    const raw = Array.isArray(plan.days) ? plan.days[0] : (plan.day || (plan.activities ? plan : null));
    if(!raw) throw new Error('The response did not contain a day.');
    const fresh = this.toDay(raw, day.date, trip, day);
    const i = trip.days.findIndex(d=>d.id===day.id);
    trip.days[i] = fresh;
    return fresh;
  }
};

async function runGeneration(scope, dayId, actId){
  const m = $(`[data-modal="${Modal.stack[Modal.stack.length-1]}"]`);
  if(!m) return;
  const trip = App.draft || App.trip;
  const day  = dayId ? trip.days.find(d=>d.id===dayId) : null;
  const act  = actId && day ? day.activities.find(a=>a.id===actId) : null;
  const nudge = m.querySelector('#genNudge')?.value.trim() || '';
  const usingPaste = m.querySelector('[data-gentab="paste"]').classList.contains('on');
  const errBox = m.querySelector('#genError');
  const showErr = (html)=>{ errBox.className=''; errBox.innerHTML =
    `<div class="act-instr" style="background:var(--bad-soft);border-color:#f3ccd4;color:#8d2036">${html}</div>`; };
  errBox.className='hidden';

  let text;
  if(usingPaste){
    text = m.querySelector('#genPasteback').value.trim();
    if(!text) return showErr('Paste Gemini&rsquo;s reply into the box first.');
  } else {
    if(AI.transport==='none') return showErr(esc(AI.friendlyError(new Error('NO_TRANSPORT'))));
    if(!AI.keyForTransport()) return showErr(esc(AI.friendlyError(new Error('NO_KEY'))));
    const status = m.querySelector('#genStatus'), pre = m.querySelector('#genPreview');
    const prog = m.querySelector('#genProgress'), chars = m.querySelector('#genChars'),
          daysP = m.querySelector('#genDays'), elap = m.querySelector('#genElapsed');
    const btn = m.querySelector('[data-act="gen-run"]');
    btn.disabled = true; btn.textContent = 'Generating…';
    status.textContent = 'Asking Gemini for real places in ' + (trip.destination.city||'your destination') + '…';
    pre.style.display='block'; prog.style.display='flex';
    const t0 = Date.now();
    const timer = setInterval(()=>{ elap.textContent = Math.round((Date.now()-t0)/1000)+'s'; }, 500);
    _genAbort = new AbortController();
    try{
      text = await AI.call({
        prompt: scope==='trip' ? AI.tripPrompt(trip, nudge)
              : scope==='day'  ? AI.dayPrompt(trip, day, nudge)
              :                  AI.itemPrompt(trip, day, act, nudge),
        maxTokens: scope==='trip' ? (Number(App.settings.maxTokens)||32768) : scope==='day' ? 8192 : 4096,
        signal: _genAbort.signal,
        onDelta: (soFar)=>{
          chars.textContent = soFar.length.toLocaleString() + ' chars';
          const n = (soFar.match(/"date"\s*:/g)||[]).length;
          daysP.textContent = scope==='trip' ? (n + ' day' + (n===1?'':'s') + ' drafted') : 'streaming…';
          pre.textContent = soFar.slice(-1400);
          pre.scrollTop = pre.scrollHeight;
        }
      });
    }catch(err){
      clearInterval(timer); btn.disabled=false; btn.textContent='✨ Generate';
      if(err.name==='AbortError'){ status.textContent='Cancelled.'; return; }
      console.error(err);
      return showErr(esc(AI.friendlyError(err)) +
        '<div style="margin-top:8px"><button class="btn xs" data-gentab-jump="paste">Switch to copy-paste →</button></div>');
    }
    clearInterval(timer); btn.disabled=false; btn.textContent='✨ Generate';
  }

  let plan;
  try{ plan = AI.extractJSON(text); }
  catch(err){ return showErr(esc(AI.friendlyError(err))); }

  try{
    if(scope==='trip'){
      const r = AI.applyTripPlan(trip, plan);
      logAction(trip,'gemini-plan', r.filled + '/' + r.days + ' days');
      if(App.draft){ await finishDraftAfterAI(); }
      else { await App.save(); Modal.close(); App.go('calendar'); }
      toast('Gemini drafted ' + r.filled + ' days — edit anything', 'good');
    }
    else if(scope==='day'){
      AI.applyDayPlan(trip, day, plan);
      logAction(trip,'gemini-day', D.fmt(day.date,'short'));
      await App.save(); Modal.close(); App.go('day',{dayId:trip.days.find(d=>d.date===day.date).id});
      toast('Day regenerated','good');
    }
    else {
      const alts = (plan.alternatives||plan.activities||[]).slice(0,3);
      if(!alts.length) throw new Error('No alternatives came back.');
      Modal.close();
      openAlternativesModal(day.id, act.id, alts.map(a=>AI.toActivity(a, trip, act.start)));
    }
  }catch(err){ console.error(err); showErr(esc(AI.friendlyError(err))); }
}

async function commitDraft(mode){
  const d = App.draft;
  for(const v of d.travelers){ if(v._pw){ await Auth.setPassword(v, v._pw); } delete v._pw; }
  if(d.travelers.length) d.travelers[0].role = d.travelers[0].role==='viewer' ? 'owner' : d.travelers[0].role;
  const blank = () => D.range(d.flights.outDate, d.flights.backDate||d.flights.outDate).map(dt=>newDay(dt));

  if(mode==='ai'){
    d.days = blank();
    d.generated = false;
    App.session = {tripId:d.id, travelerId:d.travelers[0]?.id||null, at:Date.now()};
    await Repo.setSession(App.session);
    await AI.probe();
    openGenerateModal({scope:'trip'});
    return;
  }
  d.days = mode==='rules' ? generateItinerary(d) : blank();
  d.generated = mode==='rules';
  App.trip = d;
  App.session = {tripId:d.id, travelerId:d.travelers[0]?.id||null, at:Date.now()};
  await Repo.setSession(App.session);
  logAction(d, mode==='rules'?'generated-offline':'created', d.days.length + ' days');
  await Repo.saveTrip(d);
  App.trips = await Repo.listTrips();
  App.calMonth = D.monthKey(d.days[0]?.date || D.today());
  App.draft = null;
  App.go('calendar');
  toast(mode==='rules' ? 'Offline draft ready — edit anything' : 'Empty trip created', 'good');
}

  L.push('direct->google: ' + (AI.directOK===null?'not tested':(AI.directOK?'WORKS':'BLOCKED')) +
         (AI.directNote?('  (' + AI.directNote + ')'):''));
  L.push('page url      : ' + location.href);
  L.push('page protocol : ' + location.protocol + (AI.isFileProtocol()?'  (opened from disk)':''));
  L.push('local helper  : ' + (AI.server ? ('found at "' + (AI.foundBase||'same origin') + '"') : 'not found'));
  if(AI.server){
    L.push('server version: ' + (AI.server.version||'?'));
    L.push('server folder : ' + (AI.server.root||'?'));
    L.push('app file there: ' + (AI.server.appPresent ? 'yes' : 'NO'));
    L.push('server has key: ' + (AI.server.hasServerKey ? 'yes' : 'no'));
  }
  L.push('storage       : ' + (SafeStore.persistent ? 'localStorage OK' : 'IN MEMORY ONLY - ' + SafeStore.reason));
  L.push('key source    : ' + ((AI.server && AI.server.hasServerKey) ? 'held by the server (not in this browser)'
        : (App.settings.apiKey||'').trim() ? 'pasted by this user' : 'NONE'));
  L.push('sharing       : ' + ((AI.server && AI.server.sharing) ? 'available' : 'not available'));
  L.push('model         : ' + (App.settings.model || '(none chosen)'));
  L.push('models cached : ' + ((App.settings.models||[]).length));
  L.push('max tokens    : ' + (App.settings.maxTokens||''));
  L.push('');
  L.push('origins tried:');
  (AI.probeLog||[]).forEach(r=>L.push('  ' + (r.ok?'OK  ':'--  ') + r.url + '   ' + r.note));
  return L.join('\n');
}

/* --------------------- second click listener (AI actions) ---------------- */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-act],[data-gentab-jump]');
  if(!el) return;

  if(el.dataset.gentabJump){
    const m = $(`[data-modal="${Modal.stack[Modal.stack.length-1]}"]`);
    m?.querySelector('[data-gentab="paste"]')?.click();
    return;
  }

  switch(el.dataset.act){
    case 'setup-ai':    readSetupStep(); if(!validateSetup()) return; await commitDraft('ai'); break;
    case 'setup-rules': readSetupStep(); if(!validateSetup()) return; await commitDraft('rules'); break;

    case 'ai-trip':
      Modal.closeAll();
      if(!Auth.can('edit')) return toast('Your role is read-only','bad');
      await AI.probe(); openGenerateModal({scope:'trip'}); break;
    case 'ai-day':
      if(!Auth.can('edit')) return toast('Your role is read-only','bad');
      await AI.probe(); openGenerateModal({scope:'day', dayId:App.dayId}); break;
    case 'ai-alt':
      if(!Auth.can('edit')) return toast('Your role is read-only','bad');
      await AI.probe(); openGenerateModal({scope:'item', dayId:App.dayId, actId:el.dataset.id}); break;

    case 'mobile-menu': openMobileMenu(); break;
    case 'show-welcome': App.go('welcome'); break;
    case 'onboard-start':
      App.settings.onboarded = true; await Repo.setSettings(App.settings);
      App.draft = newTrip();
      App.draft.name = '';
      App.draft.travelers = [newTraveler('Me',{role:'owner', color:PALETTE[0]})];
      App.setupStep = 0; App.trip = null; App.go('setup'); break;
    case 'onboard-skip':
      App.settings.onboarded = true; await Repo.setSettings(App.settings);
      App.go(App.trips.length ? 'home' : 'home'); break;
    case 'load-demo': {
      if(App.trips.some(x=>x.isDemo)){
        const d = App.trips.find(x=>x.isDemo);
        App.settings.onboarded = true; await Repo.setSettings(App.settings);
        return App.openTrip(d.id);
      }
      await loadDemoTrip();
      break;
    }
    case 'onboard-save-key': {
      const k = $('#w-key')?.value.trim();
      const note = $('#w-keyNote');
      if(!k){ toast('Paste a key first, or press Skip','bad'); return; }
      App.settings.apiKey = k;
      App.settings.onboarded = true;
      await Repo.setSettings(App.settings);
      if(note) note.textContent = 'Checking the key…';
      await AI.probe();
      if(AI.transport === 'none'){
        if(note) note.textContent = AI.friendlyError(new Error('NO_TRANSPORT'));
        toast('Saved, but Gemini could not be reached','bad');
        return;
      }
      try{
        App.settings.models = await AI.fetchModels();
        if(!App.settings.model) App.settings.model = AI.pickDefault(App.settings.models);
        await Repo.setSettings(App.settings);
      }catch(err){
        if(note) note.textContent = AI.friendlyError(err);
        toast('That key was not accepted','bad');
        return;
      }
      App.trips = await Repo.listTrips();
      toast('Key saved — you are ready','good');
      App.go('home');
      break;
    }

    case 'jump-act': {
      const row = document.querySelector(`.tl-item[data-actid="${el.dataset.id}"]`);
      if(!row) return;
      row.scrollIntoView({behavior:'smooth', block:'center'});
      const card = row.querySelector('.act');
      if(card){
        card.classList.remove('flash');
        void card.offsetWidth;                      // restart the animation
        card.classList.add('flash');
        setTimeout(()=>card.classList.remove('flash'), 1600);
      }
      $$('.place-row').forEach(r=>r.classList.toggle('on', r.dataset.id===el.dataset.id));
      break;
    }

    case 'gen-run': await runGeneration(el.dataset.scope, el.dataset.dayid||null, el.dataset.actid||null); break;

    case 'diagnostics': {
      const first = !AI.probed;
      if(first) await AI.probe();
      openDiagnosticsModal();
      if(!first){ AI.probe().then(()=>{ /* refresh silently in the background */ }); }
      break;
    }
    case 'diag-rescan': {
      const btn = el; btn.disabled = true; btn.textContent = 'Scanning…';
      await AI.probe();
      if(AI.transport!=='none' && AI.keyForTransport() && !(App.settings.models||[]).length){
        try{
          App.settings.models = await AI.fetchModels();
          if(!App.settings.model) App.settings.model = AI.pickDefault(App.settings.models);
          await Repo.setSettings(App.settings);
        }catch(err){}
      }
      Modal.close(); openDiagnosticsModal(); render();
      toast(AI.transport==='direct' ? 'Connected directly to Google'
          : AI.transport==='proxy' ? 'Using the local helper'
          : 'Still no route to Gemini', AI.transport==='none'?'bad':'good');
      break;
    }
    case 'diag-copy': {
      const txt = diagReportText();
      try{ await navigator.clipboard.writeText(txt); toast('Report copied','good'); }
      catch(err){ $('#diagText')?.select(); toast('Press Ctrl/Cmd+C to copy'); }
      break;
    }

    case 'gen-recheck': {
      const before = AI.transport;
      const modal = $(`[data-modal="${Modal.stack[Modal.stack.length-1]}"]`);
      // pick up a key typed into Settings but not saved yet
      const typed = modal?.querySelector('#s-apiKey')?.value.trim();
      if(typed && typed !== App.settings.apiKey){
        App.settings.apiKey = typed; await Repo.setSettings(App.settings);
      }
      el.disabled = true; const label = el.textContent; el.textContent = 'Checking…';
      await AI.probe();
      if(AI.transport!=='none' && !(App.settings.models||[]).length && AI.keyForTransport()){
        try{ App.settings.models = await AI.fetchModels();
             if(!App.settings.model) App.settings.model = AI.pickDefault(App.settings.models);
             await Repo.setSettings(App.settings); }catch(err){}
      }
      el.disabled = false; el.textContent = label;
      toast(AI.transport==='direct' ? 'Connected directly to Google'
          : AI.transport==='proxy'  ? 'Using the local helper'
          : 'Still no route to Gemini', AI.transport==='none' ? 'bad' : 'good');
      const wasSettings = !!modal?.querySelector('#s-apiKey');
      if(modal){
        const o = modal._opts; Modal.close();
        if(o) openGenerateModal(o); else if(wasSettings) openSettingsModal(); else openDiagnosticsModal();
      }
      if(before !== AI.transport) render();
      break;
    }

    case 'gen-refresh-models': {
      const m = $(`[data-modal="${Modal.stack[Modal.stack.length-1]}"]`);
      const hint = m?.querySelector('#s-modelHint');
      const keyEl = m?.querySelector('#s-apiKey');
      if(keyEl && keyEl.value.trim()) App.settings.apiKey = keyEl.value.trim();
      if(hint) hint.textContent = 'Asking Google…';
      if(AI.transport==='none') await AI.probe();
      try{
        const list = await AI.fetchModels();
        App.settings.models = list;
        if(!App.settings.model || !list.some(x=>x.id===App.settings.model))
          App.settings.model = AI.pickDefault(list);
        await Repo.setSettings(App.settings);
        const sel = m?.querySelector('#s-model');
        if(sel) sel.innerHTML = modelOptions();
        if(hint) hint.textContent = list.length + ' models available to your key';
        toast('Loaded ' + list.length + ' models','good');
      }catch(err){
        if(hint) hint.textContent = AI.friendlyError(err);
        toast('Could not load models','bad');
      }
      break;
    }

    case 'gen-cancel':
      try{ _genAbort?.abort(); }catch(err){}
      Modal.close();
      if(App.draft){
        const d=App.draft; App.trip=d; App.draft=null;
        await Repo.saveTrip(d); App.trips=await Repo.listTrips();
        App.calMonth=D.monthKey(d.days[0]?.date||D.today()); App.go('calendar');
        toast('Trip created with empty days');
      }
      break;

    case 'gen-offline': {
      Modal.closeAll();
      if(App.draft){ await commitDraft('rules'); }
      else {
        const t=App.trip;
        const fresh = generateItinerary(t);
        fresh.forEach((f,i)=>{ const old=t.days[i]; if(old){ f.id=old.id; f.photos=old.photos; f.comments=old.comments; } });
        t.days = fresh; logAction(t,'generated-offline', t.days.length+' days');
        await App.saveAndRender(); toast('Offline draft ready','good');
      }
      break;
    }

    case 'gen-save-key': {
      const m = $(`[data-modal="${Modal.stack[Modal.stack.length-1]}"]`);
      const k = m.querySelector('#genQuickKey')?.value.trim();
      if(!k) return toast('Paste a key first','bad');
      App.settings.apiKey = k; await Repo.setSettings(App.settings);
      try{
        App.settings.models = await AI.fetchModels();
        if(!App.settings.model) App.settings.model = AI.pickDefault(App.settings.models);
        await Repo.setSettings(App.settings);
      }catch(err){}
      const o = m._opts; Modal.close(); openGenerateModal(o);
      toast('Key saved','good'); break;
    }

    case 'gen-copy-prompt': {
      const m = $(`[data-modal="${Modal.stack[Modal.stack.length-1]}"]`);
      const ta = m.querySelector('#genPrompt');
      try{ await navigator.clipboard.writeText(ta.value); toast('Prompt copied','good'); }
      catch(err){ ta.select(); toast('Press Ctrl/Cmd+C to copy'); }
      break;
    }

    case 'use-alt': {
      const m = $(`[data-modal="${Modal.stack[Modal.stack.length-1]}"]`);
      const alt = m._alts[+el.dataset.i];
      const day = App.trip.days.find(d=>d.id===el.dataset.dayid);
      const i = day.activities.findIndex(a=>a.id===el.dataset.actid);
      const old = day.activities[i];
      alt.photos = old.photos; alt.comments = old.comments; alt.assigned = old.assigned;
      day.activities[i] = alt;
      day.activities.sort((a,b)=>T.toMin(a.start)-T.toMin(b.start));
      day.summary = summaryFor(day);
      logAction(App.trip,'gemini-swap', alt.title);
      Modal.close(); await App.saveAndRender(); toast('Swapped in','good'); break;
    }
  }
});

/* settings save picks up the Gemini fields before the base handler closes it */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-act="modal-save-settings"]'); if(!el) return;
  const m = $(`[data-modal="${Modal.stack[Modal.stack.length-1]}"]`);
  if(!m || !m.querySelector('#s-model')) return;
  const keyField = m.querySelector('#s-apiKey');
  if(keyField) App.settings.apiKey = keyField.value.trim();
  App.settings.model     = m.querySelector('#s-model').value.trim();
  App.settings.proxyBase = m.querySelector('#s-proxyBase').value.trim().replace(/\/+$/,'');
  App.settings.maxTokens = Math.max(2000, Math.min(200000, Number(m.querySelector('#s-maxTokens').value)||32768));
  App.settings.depth     = m._depth;
  await Repo.setSettings(App.settings);
  AI.probe();
}, true);
