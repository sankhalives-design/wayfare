/* ============================================================================
   §14  COLLABORATION
   ----------------------------------------------------------------------------
   Several people, one trip, different devices.

   In one paragraph: the trip still lives in your own browser and the app still
   reads from there, so it stays fast and works on a plane. When a trip is
   shared, every save also pushes THE DAYS THAT CHANGED to the server, and
   every few seconds the app pulls anything new. Because writes are per day,
   two people planning different days never collide. If two people do edit the
   same day at once, the second is told, shown both versions, and asked which
   to keep — nothing is ever silently overwritten.

   Access: the link is the credential, like a shared document link. Everyone
   picks which traveller they are, so edits carry a name.
   ========================================================================== */
const Cloud = {
  POLL_MS: 12000,
  _timer: null,
  status: 'off',            // off | synced | pushing | offline | conflict
  lastSync: null,

  on(trip){ return !!(trip && trip.cloudId); },
  base(){ return AI.serverBase(); },

  whoId(trip){
    const map = App.settings.who || {};
    return trip && trip.cloudId ? map[trip.cloudId] : null;
  },
  whoName(trip){
    const p = (trip.travelers || []).find(v => v.id === this.whoId(trip));
    return p ? p.name : 'someone';
  },
  async setWho(trip, travelerId){
    App.settings.who = Object.assign({}, App.settings.who || {}, {[trip.cloudId]: travelerId});
    await Repo.setSettings(App.settings);
  },

  headers(trip){
    const h = {'content-type':'application/json', 'x-wayfare-device': Repo.deviceId()};
    if(BUILD_STAMP) h['x-wayfare-build'] = BUILD_STAMP;
    if(trip) h['x-wayfare-who'] = this.whoName(trip);
    return h;
  },

  async _fetch(path, opts){
    const r = await fetch(this.base() + path, opts);
    if(r.status === 409) return {conflict: true, body: await r.json()};
    if(!r.ok){
      let m = 'HTTP ' + r.status;
      try{ m = (await r.json())?.error?.message || m; }catch(e){}
      const err = new Error(m); err.status = r.status; throw err;
    }
    return {body: await r.json()};
  },

  /* A cheap fingerprint per day, so a save can work out what actually changed
     without every one of the ~30 save call sites having to tell us. */
  sig(obj){
    const s = JSON.stringify(obj);
    let h = 5381;
    for(let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
    return h.toString(36) + ':' + s.length;
  },
  snapshot(trip){
    const sig = {};
    (trip.days || []).forEach(d => { sig[d.id] = this.sig(d); });
    const meta = Object.assign({}, trip);
    delete meta.days; delete meta._sig; delete meta._ver;
    sig.__meta = this.sig(meta);
    return sig;
  },

  url(trip){
    const u = new URL(location.href);
    u.hash = 'trip=' + trip.cloudId;
    u.search = '';
    return u.toString();
  },
  idFromUrl(){
    const h = (location.hash || '').replace(/^#/, '');
    const m = h.match(/(?:^|&)trip=([A-Za-z0-9_-]{16,64})/);
    if(m) return m[1];
    const q = new URLSearchParams(location.search).get('trip');
    return (q && /^[A-Za-z0-9_-]{16,64}$/.test(q)) ? q : null;
  },

  async create(trip){
    const {body} = await this._fetch('/api/trip', {
      method:'POST', headers:this.headers(trip), body: JSON.stringify({trip})
    });
    trip.cloudId = body.id;
    trip._ver = {trip: body.version, days: {}};
    (trip.days || []).forEach(d => { trip._ver.days[d.id] = 1; });
    trip._sig = this.snapshot(trip);
    await Repo.saveTrip(trip);
    if(!this.whoId(trip)) await this.setWho(trip, trip.travelers[0]?.id);
    this.status = 'synced'; this.lastSync = Date.now();
    this.start();
    return body.id;
  },

  /* Called from App.save() on every change. Sends only what moved. */
  async push(trip){
    if(!this.on(trip)) return;
    const now = this.snapshot(trip);
    const was = trip._sig || {};
    trip._ver = trip._ver || {trip: 0, days: {}};
    const changedDays = (trip.days || []).filter(d => now[d.id] !== was[d.id]);
    const metaChanged = now.__meta !== was.__meta;
    if(!changedDays.length && !metaChanged) return;

    this.status = 'pushing'; paintSync();
    try{
      for(const d of changedDays){
        const res = await this._fetch(`/api/trip/${trip.cloudId}/day/${d.id}`, {
          method:'PUT', headers:this.headers(trip),
          body: JSON.stringify({day: d, baseVersion: trip._ver.days[d.id] || 0})
        });
        if(res.conflict){
          this.status = 'conflict'; paintSync();
          openConflictModal(trip, d, res.body);
          return;                     // stop and let the person decide
        }
        trip._ver.days[d.id] = res.body.version;
        trip._sig[d.id] = now[d.id];
      }
      if(metaChanged){
        const res = await this._fetch(`/api/trip/${trip.cloudId}/meta`, {
          method:'PUT', headers:this.headers(trip),
          body: JSON.stringify({trip, baseVersion: trip._ver.trip || 0, force: true})
        });
        if(!res.conflict){ trip._ver.trip = res.body.version; trip._sig.__meta = now.__meta; }
      }
      this.status = 'synced'; this.lastSync = Date.now();
      await Repo.saveTrip(trip);
    }catch(err){
      /* Offline, or the server is down. The edit is safe in this browser and
         goes up on the next save or poll. This is exactly why the app reads
         from local storage rather than from the network. */
      this.status = 'offline';
      console.warn('[Wayfare] sync push failed, will retry:', err.message);
    }
    paintSync();
  },

  /* Regenerate and copy-day mean "replace this", not "merge this". */
  async pushAll(trip){
    if(!this.on(trip)) return;
    this.status = 'pushing'; paintSync();
    try{
      const {body} = await this._fetch(`/api/trip/${trip.cloudId}/all`, {
        method:'PUT', headers:this.headers(trip), body: JSON.stringify({trip})
      });
      trip._ver = {trip: body.version, days: body.versions || {}};
      trip._sig = this.snapshot(trip);
      await Repo.saveTrip(trip);
      this.status = 'synced'; this.lastSync = Date.now();
    }catch(err){ this.status = 'offline'; }
    paintSync();
  },

  async pull(trip, {quiet = true} = {}){
    if(!this.on(trip)) return;
    let body;
    try{
      const res = await this._fetch(`/api/trip/${trip.cloudId}`,
        {headers:this.headers(trip), cache:'no-store'});
      body = res.body;
    }catch(err){ this.status = 'offline'; paintSync(); return; }

    trip._ver = trip._ver || {trip: 0, days: {}};
    trip._sig = trip._sig || {};
    const localSig = this.snapshot(trip);
    let changed = 0;

    for(const remote of body.trip.days || []){
      const rv = body.versions[remote.id] || 0;
      const mine = trip.days.find(d => d.id === remote.id);
      const base = trip._ver.days[remote.id] || 0;
      const iEditedIt = mine && localSig[remote.id] !== trip._sig[remote.id];

      if(!mine){
        remote.photos = remote.photos || [];
        trip.days.push(remote);
        trip._ver.days[remote.id] = rv;
        changed++;
      } else if(rv > base && !iEditedIt){
        const keepPhotos = mine.photos || [];      // photos are per device
        Object.assign(mine, remote, {photos: keepPhotos});
        trip._ver.days[remote.id] = rv;
        changed++;
      } else if(rv > base && iEditedIt){
        this.status = 'conflict'; paintSync();
        openConflictModal(trip, mine, {current: remote, version: rv, updatedBy: body.updatedBy});
        return;
      }
    }

    if((body.tripVersion || 0) > (trip._ver.trip || 0)){
      ['name','destination','flights','constraints','travelers'].forEach(k => {
        if(body.trip[k] !== undefined) trip[k] = body.trip[k];
      });
      trip._ver.trip = body.tripVersion;
      changed++;
    }

    if(changed){
      trip.days.sort((a,b) => String(a.date).localeCompare(String(b.date)));
      trip._sig = this.snapshot(trip);
      await Repo.saveTrip(trip);
      App.trips = await Repo.listTrips();
      if(!quiet) toast('Updated — ' + (body.updatedBy || 'someone') + ' made changes','good');
      render();
    }
    this.status = 'synced'; this.lastSync = Date.now();
    paintSync();
  },

  /* Appends never conflict, so comments are the one thing that always works. */
  async comment(trip, dayId, comment){
    if(!this.on(trip)) return null;
    try{
      const {body} = await this._fetch(`/api/trip/${trip.cloudId}/day/${dayId}/comment`, {
        method:'POST', headers:this.headers(trip), body: JSON.stringify({comment})
      });
      const day = trip.days.find(d => d.id === dayId);
      if(day && body.comments) day.comments = body.comments;
      trip._ver.days[dayId] = body.version;
      trip._sig = this.snapshot(trip);
      await Repo.saveTrip(trip);
      return body;
    }catch(err){ this.status = 'offline'; paintSync(); return null; }
  },

  start(){
    this.stop();
    const tick = () => {
      if(document.hidden) return;
      if(App.trip && this.on(App.trip) && this.status !== 'conflict') this.pull(App.trip);
    };
    this._timer = setInterval(tick, this.POLL_MS);
    if(!this._bound){
      this._bound = true;
      document.addEventListener('visibilitychange', () => { if(!document.hidden) tick(); });
      window.addEventListener('focus', tick);
      window.addEventListener('online', tick);
    }
  },
  stop(){ if(this._timer) clearInterval(this._timer); this._timer = null; }
};

/* "Is my change saved for everyone?" is the question people actually have. */
function paintSync(){
  const el = document.getElementById('syncPill');
  if(!el) return;
  const map = {
    synced:   ['green', '✓ Everyone is up to date'],
    pushing:  ['amber', '↻ Saving for everyone…'],
    offline:  ['red',   '⚠ Offline — saved on this device'],
    conflict: ['amber', '! Needs your decision'],
    off:      ['',      '']
  };
  const [cls, text] = map[Cloud.status] || map.off;
  el.className = 'pill ' + cls;
  el.textContent = text;
  el.style.display = text ? '' : 'none';
}

async function joinCloudTrip(id){
  App.view = 'loading'; render();
  try{
    const r = await fetch(AI.serverBase() + '/api/trip/' + id,
      {headers:{'content-type':'application/json'}, cache:'no-store'});
    if(!r.ok){
      let m = 'HTTP ' + r.status;
      try{ m = (await r.json())?.error?.message || m; }catch(e){}
      throw new Error(m);
    }
    const body = await r.json();

    /* Already joined on this device? Open it and let the poll catch us up. */
    const existing = (await Repo.listTrips()).find(t => t.cloudId === id);
    const trip = existing || migrateTrip(body.trip);
    if(!existing){
      trip.cloudId = id;
      trip.isDemo = false;
      trip._ver = {trip: body.tripVersion, days: body.versions || {}};
      trip._sig = Cloud.snapshot(trip);
      await Repo.saveTrip(trip);
    }
    App.trips = await Repo.listTrips();
    App.trip = trip;
    App.session = {tripId: trip.id, travelerId: Cloud.whoId(trip) || trip.travelers[0]?.id, at: Date.now()};
    await Repo.setSession(App.session);
    App.settings.onboarded = true;
    await Repo.setSettings(App.settings);
    App.calMonth = D.monthKey(trip.days[0]?.date || D.today());
    if(!App.calModeTouched) App.calMode = isPhone() ? 'list' : 'month';
    Cloud.status = 'synced'; Cloud.lastSync = Date.now();
    Cloud.start();
    App.go('calendar');
    if(!Cloud.whoId(trip)) openWhoModal(trip);
  }catch(err){
    App.view = 'home'; render();
    Modal.open({
      title: 'That link did not open', narrow: true,
      body: `<div class="small">${esc(String(err.message || err))}</div>
        <div class="small muted" style="margin-top:10px">Check you copied the whole link, and that
          it points at the same site everyone else uses.</div>`,
      footer: `<div class="spacer"></div><button class="btn primary" data-act="modal-close">OK</button>`
    });
  }
}

/* -------------------------------------------------------------- actions --- */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const t = App.trip;

  switch(el.dataset.act){
    case 'invite': Modal.closeAll(); openInviteModal(); break;

    case 'invite-start': {
      const btn = el; btn.disabled = true; btn.textContent = 'Setting up…';
      try{
        await Cloud.create(t);
        App.trips = await Repo.listTrips();
        Modal.close(); openInviteModal(); render();
        toast('Sharing is on — send the link','good');
      }catch(err){
        btn.disabled = false; btn.textContent = 'Start planning together';
        toast(String(err.message||err),'bad');
      }
      break;
    }

    case 'invite-copy': {
      const v = $('#inviteLink')?.value || '';
      try{ await navigator.clipboard.writeText(v); toast('Link copied','good'); }
      catch(err){ $('#inviteLink')?.select(); toast('Press Ctrl/Cmd+C to copy'); }
      break;
    }

    case 'invite-whatsapp': {
      const v = $('#inviteLink')?.value || '';
      const msg = `Planning ${t.name} — join me and edit it with me:\n${v}`;
      window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener');
      break;
    }

    case 'who-change': e.preventDefault(); Modal.closeAll(); openWhoModal(t); break;

    case 'who-pick': {
      await Cloud.setWho(t, el.dataset.id);
      App.session = {tripId: t.id, travelerId: el.dataset.id, at: Date.now()};
      await Repo.setSession(App.session);
      Modal.close(); render();
      toast('You are ' + Cloud.whoName(t), 'good');
      break;
    }

    case 'who-add': {
      const name = $('#whoNew')?.value.trim();
      if(!name) return toast('Type your name first','bad');
      const v = newTraveler(name, {role:'editor', color:PALETTE[t.travelers.length % PALETTE.length]});
      t.travelers.push(v);
      await Cloud.setWho(t, v.id);
      App.session = {tripId: t.id, travelerId: v.id, at: Date.now()};
      await Repo.setSession(App.session);
      Modal.close();
      await App.saveAndRender();
      toast('Welcome, ' + name, 'good');
      break;
    }

    case 'conflict-keep-mine': {
      const m = $(`[data-modal="${Modal.stack[Modal.stack.length-1]}"]`);
      const c = m._conflict;
      const day = t.days.find(d => d.id === c.myDay.id);
      SafeStore.set('wayfare.discarded.v1', JSON.stringify({at:Date.now(), day:c.theirs}));
      Modal.close();
      Cloud.status = 'pushing'; paintSync();
      try{
        const res = await Cloud._fetch(`/api/trip/${t.cloudId}/day/${day.id}`, {
          method:'PUT', headers:Cloud.headers(t),
          body: JSON.stringify({day, baseVersion: c.version, force:true})
        });
        if(res.body?.version) t._ver.days[day.id] = res.body.version;
        t._sig = Cloud.snapshot(t);
        await Repo.saveTrip(t);
        Cloud.status = 'synced'; Cloud.lastSync = Date.now();
        toast('Your version kept','good');
      }catch(err){ Cloud.status = 'offline'; toast('Could not save — will retry','bad'); }
      paintSync(); render();
      break;
    }

    case 'conflict-keep-theirs': {
      const m = $(`[data-modal="${Modal.stack[Modal.stack.length-1]}"]`);
      const c = m._conflict;
      const i = t.days.findIndex(d => d.id === c.myDay.id);
      SafeStore.set('wayfare.discarded.v1', JSON.stringify({at:Date.now(), day:c.myDay}));
      if(i >= 0 && c.theirs){
        const keepPhotos = t.days[i].photos || [];
        t.days[i] = Object.assign({}, c.theirs, {photos: keepPhotos});
        t._ver.days[c.myDay.id] = c.version;
      }
      t._sig = Cloud.snapshot(t);
      await Repo.saveTrip(t);
      Cloud.status = 'synced'; Cloud.lastSync = Date.now();
      Modal.close(); paintSync(); render();
      toast('Their version kept','good');
      break;
    }

    case 'sync-now': {
      if(!Cloud.on(t)) return;
      await Cloud.push(t);
      await Cloud.pull(t, {quiet:false});
      break;
    }
  }
});

/* ============================== §11 BOOT ================================= */
(async function boot(){
  App.settings = await Repo.getSettings();
  AI.probe().then(async()=>{
    if(AI.transport !== 'none'){
      App.settings.__serverKey = !!(AI.server && AI.server.hasServerKey);
      if(AI.keyForTransport() && !(App.settings.models||[]).length){
        try{
          App.settings.models = await AI.fetchModels();
          if(!App.settings.model) App.settings.model = AI.pickDefault(App.settings.models);
          await Repo.setSettings(App.settings);
        }catch(e){ /* offline or bad key — Diagnostics will show why */ }
      }
    }
    render();            // reflects the server pill, and the welcome screen
  });
  App.trips = await Repo.listTrips();
  App.session = await Repo.getSession();
  if(App.session?.tripId){
    const t = await Repo.getTrip(App.session.tripId);
    if(t){ App.trip=t; App.calMonth=D.monthKey(t.days[0]?.date||D.today());
           App.view = t.days.length?'calendar':'home'; }
  }
  if(!App.calModeTouched) App.calMode = isPhone() ? 'list' : 'month';

  const debugHandle = () => {
    window.Wayfare = {App, Repo, PhotoStore, AI, SafeStore, Geo, Cloud, demoTrip,
      generateItinerary, D, T, newTrip, newTraveler, migrateTrip, openGenerateModal,
      commitDraft, joinCloudTrip};
  };

  /* Someone opened an invite link. Join the trip rather than showing our own. */
  const invited = Cloud.idFromUrl();
  if(invited){
    await AI.probe();
    render();
    debugHandle();
    joinCloudTrip(invited);
    return;
  }

  if(!App.settings.onboarded && !App.trips.length && !App.session) App.view = 'welcome';
  render();
  debugHandle();

  /* If the trip we reopened is a shared one, start syncing straight away. */
  if(App.trip && Cloud.on(App.trip)){
    Cloud.status = 'synced';
    Cloud.start();
    Cloud.pull(App.trip);
  }
})();
</script>
