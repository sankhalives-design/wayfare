textarea{resize:vertical;min-height:66px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

/* chips / toggles */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;transition:.14s;user-select:none}
.chip:hover{border-color:#c6cfdb}
.chip.on{background:var(--accent-soft);border-color:#b9d0ff;color:var(--accent-ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:550;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:#fff}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-b{padding:16px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:620;background:var(--line-2);color:var(--ink-2)}
.pill.blue{background:var(--accent-soft);color:var(--accent-ink)}
.pill.green{background:var(--good-soft);color:var(--good)}
.pill.amber{background:var(--warn-soft);color:var(--warn)}
.pill.red{background:var(--bad-soft);color:var(--bad)}

/* ---------- avatars ---------- */
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none;letter-spacing:.02em}
.av.lg{width:40px;height:40px;font-size:15px}
.av.sm{width:20px;height:20px;font-size:9.5px}
.av-stack{display:flex}
.av-stack .av{margin-left:-7px;border:2px solid #fff}
.av-stack .av:first-child{margin-left:0}

/* ---------- calendar ---------- */
.cal-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--panel-2);border-bottom:1px solid var(--line)}
.cal-head div{padding:8px 10px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:132px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:7px 8px;display:flex;flex-direction:column;gap:5px;position:relative}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell.out{background:#fafbfc}
.cal-cell.trip{cursor:pointer;transition:.12s}
.cal-cell.trip:hover{background:var(--accent-soft)}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-dnum{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.cal-dnum .dn{width:21px;height:21px;border-radius:6px;display:grid;place-items:center}
.cal-cell.trip .cal-dnum .dn{background:var(--accent);color:#fff}
.cal-title{font-size:12px;font-weight:620;line-height:1.3;color:var(--ink)}
.cal-items{display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal-item{font-size:11px;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.cal-meta{margin-top:auto;display:flex;gap:7px;align-items:center;font-size:11px;color:var(--muted)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.strip-day{min-width:198px;flex:none}

/* ---------- day view ---------- */
.day-layout{display:grid;grid-template-columns:1fr 366px;gap:16px;align-items:start}
@media(max-width:1000px){.day-layout{grid-template-columns:1fr}}
.timeline{position:relative;padding-left:0}
.tl-item{display:grid;grid-template-columns:78px 1fr;gap:12px;position:relative}
.tl-time{text-align:right;padding-top:14px;font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.tl-time .end{font-weight:400;font-size:11px;opacity:.75}
.tl-body{position:relative;padding-bottom:10px;border-left:2px solid var(--line);padding-left:16px}
.tl-body:before{content:"";position:absolute;left:-6px;top:18px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl-item.type-travel .tl-body:before{border-color:var(--t-travel)}
.tl-item.type-food .tl-body:before{border-color:var(--t-food)}
.tl-item.type-sight .tl-body:before{border-color:var(--t-sight)}
.tl-item.type-rest .tl-body:before{border-color:var(--t-rest)}
.tl-item.type-activity .tl-body:before{border-color:var(--t-activity)}
.tl-item.type-checkin .tl-body:before{border-color:var(--t-checkin)}
.tl-item.type-shopping .tl-body:before{border-color:var(--t-shopping)}
.tl-item.type-admin .tl-body:before{border-color:var(--t-admin)}
.act{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;box-shadow:var(--shadow);transition:.14s}
.act:hover{border-color:#cdd6e2}
.act.done{opacity:.62}
.act.done .act-title{text-decoration:line-through}
.act-title{font-weight:650;font-size:14.5px;letter-spacing:-.005em}
.act-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.act-notes{font-size:13px;color:var(--ink-2);margin-top:8px;white-space:pre-wrap}
.act-instr{margin-top:8px;background:var(--warn-soft);border:1px solid #f4e2c4;border-radius:9px;padding:8px 10px;font-size:12.5px;color:#8a5c10;white-space:pre-wrap}
.act-actions{display:flex;gap:5px;opacity:0;transition:.14s}
.act:hover .act-actions,.act:focus-within .act-actions{opacity:1}
@media(hover:none){.act-actions{opacity:1}}
.typedot{width:9px;height:9px;border-radius:3px;flex:none}

/* ---------- photos ---------- */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px}
.photo{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--line-2);cursor:pointer;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:6px;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center;opacity:0;transition:.12s}
.photo:hover .x{opacity:1}
.dropzone{border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:14px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;transition:.14s}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- comments ---------- */
.cmt{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.cmt:last-child{border-bottom:0}
.cmt-b{flex:1;min-width:0}
.cmt-h{display:flex;align-items:baseline;gap:7px}
.cmt-h b{font-size:12.5px}
.cmt-txt{font-size:13px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;margin-top:1px}

/* ---------- map ---------- */
.place-list{display:flex;flex-direction:column;gap:1px}
.place-row{display:flex;align-items:center;gap:8px;padding:7px;border-radius:8px;font-size:12.5px;cursor:pointer;transition:.12s}
.place-row:hover{background:var(--accent-soft)}
.place-row.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px #b9d0ff}
.place-pin{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none}
.place-pin.nogeo{background:var(--line);color:var(--muted)}
.place-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* travel connector between two timed items */
.tl-item.hop .tl-time{padding-top:2px;font-size:11px;font-weight:500;opacity:.7}
.tl-item.hop .tl-body{border-left:2px dashed var(--line);padding-bottom:4px;padding-top:2px}
.tl-item.hop .tl-body:before{display:none}
.hop-chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:3px 11px}
.hop-chip.tight{background:var(--warn-soft);border-color:#f0dcb8;color:#8a5c10;font-weight:600}
.hop-chip.bad{background:var(--bad-soft);border-color:#f3ccd4;color:#8d2036;font-weight:600}
.hop-chip a{color:inherit;opacity:.75}
.act.flash{animation:flashact 1.4s ease-out}
@keyframes flashact{0%{box-shadow:0 0 0 3px #b9d0ff}60%{box-shadow:0 0 0 3px #b9d0ff}100%{box-shadow:var(--shadow)}}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(19,24,32,.42);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow-y:auto}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;overflow:hidden;animation:pop .16s ease-out}
.modal.wide{max-width:840px}
.modal.narrow{max-width:420px}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.99)}to{opacity:1;transform:none}}
.modal-h{padding:15px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.modal-b{padding:18px;max-height:min(68vh,720px);overflow-y:auto}
.modal-f{padding:13px 18px;border-top:1px solid var(--line-2);display:flex;gap:9px;justify-content:flex-end;background:var(--panel-2)}

/* ---------- toast ---------- */
#toastHost{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#131820;color:#fff;padding:9px 15px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);animation:pop .15s}
.toast.bad{background:var(--bad)}
.toast.good{background:var(--good)}

/* ---------- misc ---------- */
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:8px;opacity:.5}
.sticky-side{position:sticky;top:66px}
.divider{height:1px;background:var(--line-2);margin:12px 0}
.kbd{font-family:var(--mono);font-size:11px;background:var(--line-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px}
.steps{display:flex;gap:6px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600}
.step .n{width:21px;height:21px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;font-size:11px}
.step.on{color:var(--accent-ink)} .step.on .n{background:var(--accent);color:#fff}
.step.done .n{background:var(--good);color:#fff}
.step-sep{width:20px;height:1px;background:var(--line)}
.trip-card{cursor:pointer;transition:.15s}
.trip-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.hero{background:linear-gradient(135deg,#2f6df6,#7aa2ff);border-radius:var(--radius);padding:22px;color:#fff;box-shadow:var(--shadow)}
.hero h1{color:#fff}
.hero .sub{opacity:.9;font-size:13.5px;margin-top:4px}
.badge-day{background:rgba(255,255,255,.2);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.print-only{display:none}

/* ---------- place autocomplete ---------- */
.place-field{position:relative}
.place-menu{position:absolute;z-index:60;left:0;right:0;top:calc(100% + 4px);background:var(--panel);
  border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-lg);overflow:hidden;max-height:280px;overflow-y:auto}
.place-menu.hidden{display:none}
.place-opt{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line-2);display:flex;gap:9px;align-items:flex-start}
.place-opt:last-child{border-bottom:0}
.place-opt:hover,.place-opt.sel{background:var(--accent-soft)}
.place-opt .pin{opacity:.5;font-size:13px;line-height:1.4}
.place-opt b{font-size:13.5px;font-weight:620;display:block}
.place-opt span{font-size:12px;color:var(--muted);display:block;margin-top:1px}
.place-note{font-size:11.5px;margin-top:5px;display:flex;align-items:center;gap:6px}
.place-note.ok{color:var(--good)}
.place-note.warn{color:var(--warn)}
.place-foot{padding:6px 12px;font-size:10.5px;color:var(--muted);background:var(--panel-2);border-top:1px solid var(--line-2)}

/* ==========================================================================
   PHONES.  Everything above is the desktop layout; this section reshapes it
   for a ~390px screen. Written mobile-last (rather than mobile-first) because
   the desktop layout came first — the overrides are all in one place instead
   of scattered, which makes them easy to audit.
   ========================================================================== */
@supports(padding:max(0px)){
  .topbar{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
  .main{padding-bottom:max(80px, calc(60px + env(safe-area-inset-bottom)))}
}
.app{min-height:100vh}
@supports(height:100dvh){ .app{min-height:100dvh} }

.only-mobile{display:none}

@media(max-width:760px){
  /* iOS zooms the whole page when a focused input is under 16px */
  input[type=text],input[type=date],input[type=time],input[type=number],
  input[type=password],input[type=email],select,textarea{font-size:16px;padding:10px 12px}
  body{font-size:15px}
  .only-mobile{display:inline-flex}
  .no-mobile{display:none !important}

  .main{padding:14px 13px 90px}
  h1{font-size:22px} h2{font-size:17.5px}

  /* topbar collapses to brand + one menu button */
  .topbar{padding:9px 13px;gap:8px}
  .brand span{font-size:15px}
  .crumb{font-size:12px}

  /* fat enough to hit with a thumb */
  .btn{padding:10px 14px;font-size:14px;min-height:40px}
  .btn.sm{padding:8px 11px;font-size:13px;min-height:36px}
  .btn.xs{padding:6px 9px;font-size:12.5px;min-height:32px}
  .btn-icon{width:38px;height:38px}
  .chip{padding:8px 14px;font-size:13.5px}

  /* modals go full-bleed */
  .modal-bg{padding:0;align-items:flex-end}
  .modal,.modal.wide,.modal.narrow{max-width:100%;border-radius:16px 16px 0 0;
    max-height:94vh;display:flex;flex-direction:column}
  @supports(max-height:94dvh){ .modal{max-height:94dvh} }
  .modal-h{position:sticky;top:0;background:var(--panel);z-index:2;padding:14px 15px}
  .modal-b{padding:15px;max-height:none;flex:1;-webkit-overflow-scrolling:touch}
  .modal-f{position:sticky;bottom:0;padding:12px 15px;
    padding-bottom:max(12px, env(safe-area-inset-bottom));flex-wrap:wrap;gap:8px}
  .modal-f .btn{flex:1;justify-content:center;min-width:120px}
  .modal-f .spacer{display:none}

  /* timeline: reclaim the time gutter */
  .tl-item{grid-template-columns:52px 1fr;gap:8px}
  .tl-time{font-size:11.5px;padding-top:13px}
  .tl-body{padding-left:12px}
  .act{padding:11px}
  .act-title{font-size:14px}
  .act-actions{opacity:1;flex-wrap:wrap}

  /* month grid is unreadable at this width — keep it, but shrink it hard */
  .cal-cell{min-height:60px;padding:4px 3px;gap:2px}
  .cal-items,.cal-title{display:none}
  .cal-dnum{font-size:11px;justify-content:center}
  .cal-dnum .dn{width:24px;height:24px}
  .cal-dnum .tiny{display:none}
  .cal-meta{justify-content:center;gap:4px;font-size:10px}
  .cal-head div{padding:6px 2px;font-size:9.5px;text-align:center;letter-spacing:0}
  .cal-wrap .card-h .tiny{display:none}

  /* editable tables become stacked cards */
  table.tbl.stack,table.tbl.stack tbody,table.tbl.stack tr,table.tbl.stack td{display:block;width:100%}
  table.tbl.stack thead{display:none}
  table.tbl.stack tr{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--panel-2)}
  table.tbl.stack tr.section-row{border:0;background:transparent;padding:0;margin:14px 0 6px}
  table.tbl.stack td{border:0;padding:5px 0}
  table.tbl.stack td:before{content:attr(data-label);display:block;font-size:11px;
    font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  table.tbl.stack td[data-label=""]:before,table.tbl.stack td:not([data-label]):before{display:none}
  /* read-only tables just scroll */
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

  .day-layout{gap:12px}
  .sticky-side{position:static}
  .steps{gap:4px;font-size:11.5px}
  .step-sep{width:10px}
  .photo-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
  .hero{padding:18px}
  .seg button{padding:9px 12px}
  #toastHost{bottom:max(18px, env(safe-area-inset-bottom));width:calc(100% - 28px)}
  .toast{width:100%;text-align:center}
}

@media(max-width:400px){
  .grid2,.grid3,.grid4{gap:10px}
  .modal-f .btn{min-width:100%}
  .cal-cell{min-height:52px}
}

/* coarse pointers: never rely on hover to reveal controls */
@media(pointer:coarse){
  .act-actions{opacity:1}
  .photo .x{opacity:1}
}
@media print{
  .topbar,.act-actions,.btn,.dropzone{display:none !important}
  .print-only{display:block}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}
</style>

<body>
<div id="app" class="app"></div>
<div id="modalHost"></div>
<div id="toastHost"></div>
<input type="file" id="filePicker" accept="image/*" multiple class="hidden">
<input type="file" id="jsonPicker" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* ============================================================================
   WAYFARE — Trip Itinerary Planner  ·  v1.0
   Single-file app. No build step, no server, no network required.

   ARCHITECTURE MAP (for future iterations)
   ---------------------------------------------------------------------------
   §1  Utilities            — dates, ids, dom, toast, hashing
   §2  Persistence          — Repo (localStorage) + PhotoStore (IndexedDB)
                              Repo is an async interface on purpose: a cloud
                              adapter (Firebase/Supabase) can replace the body
                              of each method without touching the UI layer.
   §3  Domain model         — factories + schema version + migrations
   §4  Auth                 — per-trip traveller profiles, PBKDF2-ish hashing
   §5  Itinerary engine     — activity template library + rule-based generator
   §6  App state + router
   §7  Views                — home / setup wizard / calendar / day
   §8  Modals               — activity, copy-day, travellers, settings, photo
   §9  Maps integration     — Google Maps JS API (key from settings) + fallback
   §10 Boot
   ========================================================================== */

/* ================================ §1 UTIL ================================= */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);

const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr = (s='') => esc(s);

/* --- dates: all trip dates are plain 'YYYY-MM-DD' strings, timezone-free --- */
const D = {
  today(){ const d=new Date(); return D.fromParts(d.getFullYear(), d.getMonth()+1, d.getDate()); },
  fromParts(y,m,d){ return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; },
  parse(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y, m-1, d); },
  add(s, n){ const d=D.parse(s); d.setDate(d.getDate()+n); return D.fromParts(d.getFullYear(), d.getMonth()+1, d.getDate()); },
  diff(a,b){ return Math.round((D.parse(b)-D.parse(a))/86400000); },
  dow(s){ return D.parse(s).getDay(); },
  isValid(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s||'') && !isNaN(D.parse(s)); },
  fmt(s, style='med'){
    if(!D.isValid(s)) return '—';
    const d=D.parse(s);
    const wd=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
    const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    const moLong=['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()];
    if(style==='short') return `${mo} ${d.getDate()}`;
    if(style==='dow')   return `${wd.slice(0,3)}, ${mo} ${d.getDate()}`;
    if(style==='long')  return `${wd}, ${moLong} ${d.getDate()}, ${d.getFullYear()}`;
    return `${mo} ${d.getDate()}, ${d.getFullYear()}`;
  },
  monthKey(s){ return s.slice(0,7); },
  monthLabel(k){ const [y,m]=k.split('-').map(Number);
    return ['January','February','March','April','May','June','July','August','September','October','November','December'][m-1]+' '+y; },
  range(a,b){ const out=[]; let c=a; let guard=0; while(c<=b && guard++<400){ out.push(c); c=D.add(c,1);} return out; }
};

/* --- times: 'HH:MM' 24h strings --- */
const T = {
  toMin(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+(m||0); },
  fromMin(n){ n=((n%1440)+1440)%1440; return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`; },
  add(t,mins){ return T.fromMin(T.toMin(t)+mins); },
  fmt(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number);
    const ap = h<12?'AM':'PM'; const hh = h%12===0?12:h%12; return `${hh}:${String(m).padStart(2,'0')} ${ap}`; },
  dur(a,b){ const d=T.toMin(b)-T.toMin(a); return d>0?d:0; },
  durLabel(mins){ if(mins<=0) return ''; const h=Math.floor(mins/60), m=mins%60;
    return (h?h+'h':'')+(m?(h?' ':'')+m+'m':''); }
};

const relTime = ts => {
  const s = Math.round((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<604800) return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString();
};

const PALETTE = ['#2f6df6','#e0572f','#12996b','#8a54e8','#e08a1e','#d94f8c','#12a3a3','#5b6ef5','#b0432b','#4a6572'];
const initials = n => String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';

function toast(msg, kind=''){
  const host=$('#toastHost'); if(!host) return;
  const el=document.createElement('div'); el.className='toast '+kind; el.textContent=msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='.3s'; el.style.opacity='0'; el.style.transform='translateY(6px)';
    setTimeout(()=>el.remove(),320); }, 2400);
}

/* SHA-256 with per-trip salt. This is obfuscation for a local file, NOT
   server-grade security — see the README note in Settings. */
async function hashSecret(secret, salt){
  const data = new TextEncoder().encode(`wayfare:v1:${salt}:${secret}`);
  if(!(crypto && crypto.subtle)) {           // file:// on some browsers
    let h=0; const s=`${salt}:${secret}`;
    for(let i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; }
    return 'fb'+Math.abs(h).toString(16);
  }
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* =========================== §2 PERSISTENCE ============================== */
/* Every method is async so a remote adapter is a drop-in replacement. */
const LS_TRIPS='wayfare.trips.v1', LS_SESSION='wayfare.session.v1', LS_SETTINGS='wayfare.settings.v1';

/* localStorage throws outright in some contexts — a file:// page in Firefox,
   private windows, blocked third-party storage. Never let that kill the app:
   fall back to memory so the session still works, and say so in Diagnostics. */
const SafeStore = (function(){
  let backing = null;
  try{
    const probe = '__wayfare_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    backing = window.localStorage;
  }catch(e){ backing = null; }
  const mem = new Map();
  return {
    persistent: !!backing,
    reason: backing ? '' : 'localStorage is blocked in this context',
    get(k){
      try{ if(backing) return backing.getItem(k); }catch(e){}
      return mem.has(k) ? mem.get(k) : null;
    },
    set(k, v){
      try{ if(backing){ backing.setItem(k, v); mem.set(k, v); return true; } }catch(e){
        this.persistent = false; this.reason = 'storage is full or blocked';
      }
      mem.set(k, v);
      return false;                       // stored, but only for this session
    },
    del(k){
      try{ if(backing) backing.removeItem(k); }catch(e){}
      mem.delete(k);
    },
    size(k){ try{ return (this.get(k)||'').length; }catch(e){ return 0; } }
  };
})();

const Repo = {
  _read(k, fb){
    try{ const v = SafeStore.get(k); return v ? JSON.parse(v) : fb; }
    catch(e){ console.warn('read fail', k, e); return fb; }
  },
  _write(k, v){
    let json;
    try{ json = JSON.stringify(v); }catch(e){ console.error(e); return false; }
    const durable = SafeStore.set(k, json);
    if(!durable && !Repo._warned){
      Repo._warned = true;
      toast('Changes are not being saved to disk — see Settings → Diagnostics', 'bad');
    }
    return true;
  },
  _warned:false,

  async listTrips(){ return (this._read(LS_TRIPS, [])).map(migrateTrip); },
  async getTrip(id){ return (await this.listTrips()).find(t=>t.id===id) || null; },
  async saveTrip(trip){
    const all = this._read(LS_TRIPS, []);
    trip.updatedAt = Date.now();
    const i = all.findIndex(t=>t.id===trip.id);
    if(i>=0) all[i]=trip; else all.push(trip);
    this._write(LS_TRIPS, all);
    return trip;
  },
  async deleteTrip(id){
    const all = this._read(LS_TRIPS, []).filter(t=>t.id!==id);
    this._write(LS_TRIPS, all);
    await PhotoStore.purgeTrip(id);
  },
  async getSession(){ return this._read(LS_SESSION, null); },
  async setSession(s){ if(s) this._write(LS_SESSION, s); else SafeStore.del(LS_SESSION); },
  /* A stable random id per browser. Phase 0 has no accounts, but every write
     records who made it, so that when accounts arrive there is authorship to
     back-fill from instead of a blank column. */
  deviceId(){
    let id = SafeStore.get('wayfare.device.v1');
    if(!id || !/^[a-z0-9_-]{6,64}$/i.test(id)){
      id = 'dev_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
      SafeStore.set('wayfare.device.v1', id);
    }
    return id;
  },
  async getSettings(){ return Object.assign({
      units:'metric', weekStart:0,
      apiKey:'', model:'', proxyBase:'', maxTokens:32768, models:[],
      depth:{places:true, food:false, transport:false, tips:true}
    }, this._read(LS_SETTINGS, {})); },
  async setSettings(s){ this._write(LS_SETTINGS, s); }
};

/* Photos live in IndexedDB (blobs), keyed by photo id, tagged with tripId
   so deleting a trip can purge them. localStorage would blow up on images. */
const PhotoStore = {
  _db:null,
  async open(){
    if(this._db) return this._db;
    return this._db = await new Promise((res,rej)=>{
      if(!('indexedDB' in window)) return rej(new Error('no-idb'));
      const rq = indexedDB.open('wayfare-photos', 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if(!db.objectStoreNames.contains('photos')){
          const st = db.createObjectStore('photos', {keyPath:'id'});
          st.createIndex('tripId','tripId',{unique:false});
        }
      };
      rq.onsuccess = ()=>res(rq.result);
      rq.onerror   = ()=>rej(rq.error);
    });
  },
  async put(rec){
    try{
      const db = await this.open();
      return await new Promise((res,rej)=>{
        const tx=db.transaction('photos','readwrite');
        tx.objectStore('photos').put(rec);
        tx.oncomplete=()=>res(rec); tx.onerror=()=>rej(tx.error);
      });
    }catch(e){ console.warn('photo put failed',e); toast('Could not save photo','bad'); return null; }
  },
  async get(id){
    try{
      const db = await this.open();
      return await new Promise((res,rej)=>{
        const rq=db.transaction('photos').objectStore('photos').get(id);
        rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error);
      });
    }catch(e){ return null; }
  },
  async getMany(ids){ const out={}; for(const id of ids||[]){ const r=await this.get(id); if(r) out[id]=r; } return out; },
  async del(id){
    try{
      const db = await this.open();
      return await new Promise((res)=>{
        const tx=db.transaction('photos','readwrite');
        tx.objectStore('photos').delete(id); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
      });
    }catch(e){ return false; }
  },
  async purgeTrip(tripId){
    try{
      const db = await this.open();
      return await new Promise(res=>{
        const tx=db.transaction('photos','readwrite'), st=tx.objectStore('photos');
        const rq=st.index('tripId').openCursor(IDBKeyRange.only(tripId));
        rq.onsuccess=()=>{ const c=rq.result; if(c){ st.delete(c.primaryKey); c.continue(); } };
        tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
      });
    }catch(e){ return false; }
  },
  async listTrip(tripId){
    try{
      const db = await this.open();
      return await new Promise(res=>{
        const out=[]; const tx=db.transaction('photos');
        const rq=tx.objectStore('photos').index('tripId').openCursor(IDBKeyRange.only(tripId));
        rq.onsuccess=()=>{ const c=rq.result; if(c){ out.push(c.value); c.continue(); } };
        tx.oncomplete=()=>res(out); tx.onerror=()=>res(out);
      });
    }catch(e){ return []; }
  }
};

/* Downscale an image file to a data URL (keeps localStorage/IDB sane). */
function fileToImages(file, maxFull=1600, maxThumb=360){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(fr.error);
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('decode'));
      img.onload=()=>{
        const draw=(max)=>{
          const scale=Math.min(1, max/Math.max(img.width,img.height));
          const c=document.createElement('canvas');
          c.width=Math.max(1,Math.round(img.width*scale));
          c.height=Math.max(1,Math.round(img.height*scale));
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          return c.toDataURL('image/jpeg',0.82);
        };
        resolve({full:draw(maxFull), thumb:draw(maxThumb), w:img.width, h:img.height});
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* Forward-compatible loader: old saved trips get missing fields filled in. */
function migrateTrip(t){
  if(!t) return t;
  t.schemaVersion = t.schemaVersion || 1;
  t.constraints = Object.assign(defaultConstraints(), t.constraints||{});
  t.destination = Object.assign({city:'',country:'',label:'',stayName:'',stayAddress:'',stayLabel:'',
    lat:null,lng:null,cityLat:null,cityLng:null}, t.destination||{});
  t.flights = Object.assign({outDate:'',outTime:'',arrTime:'',outFrom:'',outTo:'',outNo:'',backDate:'',backTime:'',backFrom:'',backTo:'',backNo:'',international:true}, t.flights||{});
  t.travelers = (t.travelers||[]).map(v=>{
    const p = Object.assign(newTraveler(v.name), v);
    if(typeof p.traveling !== 'boolean') p.traveling = true;   // pre-1.3 people all travelled
    return p;
  });
  t.days = (t.days||[]).map(d=>{
    d.activities = (d.activities||[]).map(a=>Object.assign(newActivity(), a, {
      place: Object.assign({name:'',address:'',lat:null,lng:null}, a.place||{}),
      booking: Object.assign({ref:'',url:'',status:'none'}, a.booking||{})
    }));
    d.comments = d.comments||[]; d.photos = d.photos||[];
    return d;
  });
  t.activityLog = t.activityLog||[];
  return t;
}

function logAction(trip, action, detail){
  trip.activityLog = trip.activityLog || [];
  trip.activityLog.unshift({ts:Date.now(), by:App.session?.travelerId||null, action, detail:detail||''});
  if(trip.activityLog.length>250) trip.activityLog.length=250;

  async setPassword(traveler, pw){

};

const NEIGHBOURHOODS = ['old town','riverside','artists’ quarter','harbour','uptown','market district','lakeside','hill quarter'];

function pickTemplates(trip, {slot, count, used, kidSafe, lowMobility, allowFullDay}){
  const wants = trip.constraints.interests || [];
  const scored = TEMPLATES
    .filter(t => allowFullDay ? true : !t.fullDay)
    .filter(t => slot==='any' ? true : (t.slot===slot || t.slot==='any'))
    .filter(t => kidSafe ? t.kid : true)
    .filter(t => lowMobility ? t.energy!=='high' : true)
    .map(t => {
      let s = 0;
      const hits = t.tags.filter(x=>wants.includes(x)).length;
      s += hits*10;
      if(!wants.length) s += 3;                          // no prefs → everything equal-ish
      if(used.has(t.t)) s -= 100;                        // strongly avoid repeats
      if(t.slot===slot) s += 2;
      s += Math.random()*3;                              // gentle variety between runs
      return {t, s};
    })
    .sort((a,b)=>b.s-a.s);
  return scored.slice(0, count).map(x=>x.t);
}

function fillTemplate(str, trip){
  return str
    .replace(/\{city\}/g, trip.destination.city || 'the city')
    .replace(/\{neighbourhood\}/g, NEIGHBOURHOODS[Math.floor(Math.random()*NEIGHBOURHOODS.length)]);
}

/* The generator. Returns a fresh days[] array. Pure — no side effects. */
function generateItinerary(trip){
  const f = trip.flights;
  const startDate = f.outDate, endDate = f.backDate || f.outDate;
  if(!D.isValid(startDate)) return [];
  const dates = D.range(startDate, D.isValid(endDate) ? endDate : startDate);
  const c = trip.constraints;
  const pace = PACE[c.pace] || PACE.balanced;
  const kidSafe = !!c.hasKids;
  const lowMobility = c.mobility!=='none' || !!c.hasSeniors;
  const used = new Set();
  const days = [];
  const dayStart = c.dayStart || pace.start;
  const dayEnd   = c.dayEnd   || pace.end;
  const restEvery = Number(c.restDayEvery)||0;

  const mustSee = String(c.mustSee||'').split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean);
  const mustQueue = mustSee.slice();

  dates.forEach((date, i) => {
    const isFirst = i===0, isLast = i===dates.length-1 && dates.length>1;
    const acts = [];
    let cursor = dayStart;
    const push = (o)=>{ const a=newActivity(Object.assign({source:'generated'}, o)); acts.push(a); return a; };
    const block = (mins, o)=>{ const start=cursor, end=T.add(cursor,mins); cursor=T.add(end, 20);
      return push(Object.assign({start,end}, o)); };

    let archetype='explore', title='';

    /* ---------- ARRIVAL DAY ---------- */
    if(isFirst){
      archetype='arrival'; title='Arrival & settle in';
      const land = f.arrTime || '12:00';
      let t = T.add(land, 60);
      push({start:land, end:t, type:'admin', title:'Arrive, clear the airport, pick up bags',
        instructions:'Have the address of your stay handy for any arrival form. Grab a local SIM or eSIM and some cash before you leave the terminal.'});
      let t2 = T.add(t, 60);
      push({start:t, end:t2, type:'travel', title:`Transfer to ${trip.destination.stayName||'the stay'}`,
        place:{name:trip.destination.stayName||'', address:trip.destination.stayAddress||'', lat:trip.destination.lat, lng:trip.destination.lng},
        instructions:'Pre-book the transfer or use the official taxi/metro counter. Confirm the fare before you get in.'});
      let t3 = T.add(t2, 45);
      push({start:t2, end:t3, type:'checkin', title:`Check in — ${trip.destination.stayName||'accommodation'}`,
        place:{name:trip.destination.stayName||'', address:trip.destination.stayAddress||'', lat:trip.destination.lat, lng:trip.destination.lng}});
      cursor = T.add(t3, 30);
      if(T.toMin(cursor) < T.toMin('19:00')){
        block(pace.anchors>1?100:75, {type:'sight', title:'Easy first look around the neighbourhood',
          notes:'Deliberately light — jet lag day. Get oriented, find a pharmacy, ATM and a breakfast spot for tomorrow.'});
      }
      const dinner = T.toMin(cursor)>T.toMin('19:30') ? cursor : (T.toMin(cursor)<T.toMin('18:45') ? '19:00' : cursor);
      push({start:dinner, end:T.add(dinner,90), type:'food', title:'Dinner near the stay'});
      push({start:T.add(dinner,110), end:T.add(dinner,170), type:'rest', title:'Early night — recover',
        notes:'Set alarms, charge devices, lay out tomorrow’s tickets.'});
    }

    /* ---------- DEPARTURE DAY ---------- */
    else if(isLast){
      archetype='departure'; title='Departure day';
      const dep = f.backTime || '15:00';
      const leaveForAirport = T.add(dep, -210);   // 3h at the airport + transfer
      push({start:'08:00', end:'09:00', type:'food', title:'Breakfast'});
      const freeMins = T.toMin(leaveForAirport) - T.toMin('09:15');
      if(freeMins > 150){
        push({start:'09:15', end:T.add('09:15',120), type:'shopping', title:'Last-minute souvenirs / final stroll',
          notes:'Keep it close to the stay so you are not rushing back.'});
        push({start:T.add(leaveForAirport,-60), end:T.add(leaveForAirport,-15), type:'admin', title:'Pack, check out & store bags'});
      } else {
        push({start:'09:15', end:T.add('09:15',Math.max(30,Math.min(90,freeMins-30))), type:'admin', title:'Pack & check out'});
      }
      push({start:leaveForAirport, end:T.add(leaveForAirport,75), type:'travel', title:'Transfer to airport',
        instructions:'Leave buffer for traffic. Re-check the terminal number on the airline app before leaving.'});
      push({start:T.add(leaveForAirport,75), end:dep, type:'admin', title:'Check-in, security & boarding',
        instructions:'Claim any VAT/tax refund before security, not after.'});
      push({start:dep, end:T.add(dep,120), type:'travel', title:'Depart'});
    }

    /* ---------- REST DAY ---------- */
    else if(restEvery>0 && i>0 && i % restEvery === 0){
      archetype='rest'; title='Slow day';
      push({start:'09:30', end:'10:30', type:'food', title:'Long breakfast'});
      const [tp] = pickTemplates(trip, {slot:'any', count:1, used, kidSafe, lowMobility:true, allowFullDay:false});
      if(tp){ used.add(tp.t); push({start:'11:00', end:T.add('11:00',tp.mins), type:tp.type, title:fillTemplate(tp.t,trip), tags:tp.tags}); }
      push({start:'13:30', end:'14:45', type:'food', title:'Unhurried lunch'});
      push({start:'15:00', end:'17:30', type:'rest', title:'Downtime at the stay', notes:'Nap, pool, laundry, replan the rest of the trip.'});
      push({start:'19:00', end:'20:30', type:'food', title:'Dinner nearby'});
    }

    /* ---------- FULL EXPLORING DAY ---------- */
    else {
      const nAnchors = pace.anchors;
      const amCount = nAnchors>=2 ? 1 : 1;
      const pmCount = Math.max(0, nAnchors-1);
      const wantFullDay = nAnchors>=2 && (i%3===2);
      const amPicks = pickTemplates(trip, {slot:'am', count:amCount, used, kidSafe, lowMobility, allowFullDay:wantFullDay});
      const pmPicks = pickTemplates(trip, {slot:'pm', count:pmCount, used, kidSafe, lowMobility, allowFullDay:false});
      const evePicks = pickTemplates(trip, {slot:'eve', count:(pace.anchors>=2?1:0), used, kidSafe, lowMobility, allowFullDay:false});

      cursor = dayStart;
      block(45, {type:'food', title:'Breakfast'});

      const bigOne = amPicks[0] && amPicks[0].fullDay;
      if(bigOne){
        used.add(amPicks[0].t);
        archetype='daytrip'; title=fillTemplate(amPicks[0].t, trip);
        block(amPicks[0].mins, {type:amPicks[0].type, title:fillTemplate(amPicks[0].t,trip), tags:amPicks[0].tags,
          notes:'Big day — carry water, snacks, sunscreen and a power bank. Check the last return time before you leave.'});
        block(90, {type:'food', title:'Dinner back in town'});
      } else {
        amPicks.forEach(tp=>{ used.add(tp.t);
          block(tp.mins, {type:tp.type, title:fillTemplate(tp.t,trip), tags:tp.tags}); });
        if(mustQueue.length && Math.random()<0.9){
          const m = mustQueue.shift();
          block(120, {type:'sight', title:m, notes:'From your must-see list.', tags:['must-see']});
        }
        const lunchAt = T.toMin(cursor)<T.toMin('12:15') ? '12:30' : cursor;
        push({start:lunchAt, end:T.add(lunchAt,75), type:'food', title:'Lunch'});
        cursor = T.add(lunchAt, 95);
        if(pace.siesta){
          push({start:cursor, end:T.add(cursor,75), type:'rest', title:'Rest at the stay'});
          cursor = T.add(cursor, 95);
        }
        pmPicks.forEach(tp=>{ used.add(tp.t);
          block(tp.mins, {type:tp.type, title:fillTemplate(tp.t,trip), tags:tp.tags}); });
        evePicks.forEach(tp=>{ used.add(tp.t);
          const at = T.toMin(cursor)<T.toMin('17:30') ? '17:45' : cursor;
          push({start:at, end:T.add(at,tp.mins), type:tp.type, title:fillTemplate(tp.t,trip), tags:tp.tags});
          cursor = T.add(at, tp.mins+20);
        });
        const dinAt = T.toMin(cursor)<T.toMin('19:00') ? '19:15' : cursor;
        if(T.toMin(dinAt) < T.toMin(dayEnd)) push({start:dinAt, end:T.add(dinAt,90), type:'food', title:'Dinner'});
        title = title || (amPicks[0] ? fillTemplate(amPicks[0].t, trip) : 'Explore ' + (trip.destination.city||'the city'));
      }
    }

    const d = newDay(date, {title, archetype, activities:acts.sort((a,b)=>T.toMin(a.start)-T.toMin(b.start))});
    d.summary = summaryFor(d);
    days.push(d);
  });

  return days;
}

function summaryFor(day){
  const hi = day.activities.filter(a=>['sight','activity','shopping'].includes(a.type)).slice(0,3).map(a=>a.title);
  return hi.join(' · ');
}

/* ======================= §6 APP STATE + ROUTER ============================ */
const App = {
  trips:[], trip:null, session:null, settings:{},
  view:'home',           // home | login | setup | calendar | day
  dayId:null, setupStep:0, draft:null, calMode:'month', calModeTouched:false, calMonth:null,
  shared:null,          // set when viewing someone else's shared snapshot
  filter:{traveler:'all', type:'all'},

  me(){
    if(!this.trip || !this.session || this.session.tripId!==this.trip.id) return null;
    return this.trip.travelers.find(t=>t.id===this.session.travelerId) || null;
  },
  day(){ return this.trip?.days.find(d=>d.id===this.dayId) || null; },

  /* Every save goes through here, so this is the one place that needs to know
     about syncing. If the trip is shared, work out what changed and send it.
     A wholesale change to the day list (Regenerate, copy-day, a rebuilt trip)
     replaces everything rather than trying to merge — the person meant to
     replace it. */
  async save(){
    if(!this.trip) return;
    await Repo.saveTrip(this.trip);
    if(typeof Cloud !== 'undefined' && Cloud.on(this.trip)){
      const before = Object.keys(this.trip._sig || {}).filter(k => k !== '__meta').sort().join(',');
      const after  = (this.trip.days || []).map(d => d.id).sort().join(',');
      if(before !== after) await Cloud.pushAll(this.trip);
      else                 await Cloud.push(this.trip);
    }
  },
  async saveAndRender(){ await this.save(); render(); },

  go(view, opts={}){
    this.view = view;
    if(opts.dayId !== undefined) this.dayId = opts.dayId;
    window.scrollTo({top:0, behavior:'instant'});
    render();
  },

  async openTrip(id){
    this.trip = await Repo.getTrip(id);
    if(!this.trip) return toast('Trip not found','bad');
    const needsLogin = this.trip.travelers.some(t=>t.passHash);
    const s = this.session;
    if(needsLogin && !(s && s.tripId===this.trip.id)){ this.go('login'); return; }
    if(!needsLogin && this.trip.travelers.length){
      this.session = {tripId:this.trip.id, travelerId:this.trip.travelers[0].id, at:Date.now()};
      await Repo.setSession(this.session);
    }
    this.calMonth = D.monthKey(this.trip.days[0]?.date || D.today());
    if(!this.calModeTouched) this.calMode = isPhone() ? 'list' : 'month';
    if(!this.trip.days.length){ this.draft = this.trip; this.setupStep = 0; }
    this.go(this.trip.days.length ? 'calendar' : 'setup');
    if(typeof Cloud !== 'undefined' && Cloud.on(this.trip)){
      Cloud.status = 'synced';
      Cloud.start();
      Cloud.pull(this.trip);            // catch up on anything missed
    } else if(typeof Cloud !== 'undefined'){
      Cloud.status = 'off'; Cloud.stop();
    }
  }
};

function render(){
  const root = $('#app');
  let body='';
  switch(App.view){
    case 'loading':  body = `<div class="card"><div class="empty">
        <div class="big">⏳</div><div>Opening the shared plan…</div></div></div>`; break;
    case 'welcome':  body = viewWelcome(); break;
    case 'home':     body = viewHome(); break;
    case 'login':    body = viewLogin(); break;
    case 'setup':    body = viewSetup(); break;
    case 'calendar': body = viewCalendar(); break;
    case 'day':      body = viewDay(); break;
    default:         body = viewHome();
  }
  root.innerHTML = topbar() + `<div class="main">${body}</div>`;
  afterRender();
}

      <div class="field place-field">
        <label>Where are you staying? <span class="muted" style="font-weight:400">(optional)</span></label>
        <input type="text" id="f-stay" data-place="stay"
          autocomplete="off" spellcheck="false"
          ${destPicked?`data-place-near='${attr(JSON.stringify({lat:dest.cityLat, lng:dest.cityLng}))}'`:''}
          value="${attr(dest.stayLabel || dest.stayName || dest.stayAddress || '')}"
          placeholder="Hotel, neighbourhood or address">
        <div class="place-menu hidden"></div>
        <div class="place-note ${stayPicked?'ok':''}">${stayPicked
          ? '✓ ' + esc(dest.stayLabel || dest.stayName)
          : 'Each day starts and ends from here. Skip it if you have not booked yet.'}</div>
      </div>

      <div class="divider"></div>

      <div class="grid2">
        <div class="field"><label>Arrive — date *</label>
          <input type="date" id="f-outDate" value="${attr(d.flights.outDate)}"></div>
        <div class="field"><label>Arrive — time</label>
          <input type="time" id="f-arrTime" value="${attr(d.flights.arrTime||'')}">
          <div class="hint">When you actually get there. Day 1 is built around it.</div></div>
      </div>

      <div class="grid2">
        <div class="field"><label>Leave — date *</label>
          <input type="date" id="f-backDate" value="${attr(d.flights.backDate)}"></div>
        <div class="field"><label>Leave — time</label>
          <input type="time" id="f-backTime" value="${attr(d.flights.backTime||'')}">
          <div class="hint">Departure time. The last day works backwards from it.</div></div>
      </div>

    </div></div>`;
  }

  if(step===1){
    body = `
    <div class="card"><div class="card-h"><h2>Who's involved</h2>
      <div class="spacer"></div>
      <button class="btn sm" data-act="draft-add-traveler">+ Traveller</button>
      <button class="btn sm" data-act="draft-add-collaborator">+ Collaborator</button></div>
      <div class="card-b">
      <div class="small muted" style="margin-bottom:12px">
        <b>Travellers</b> are on the trip — Gemini plans around their ages and needs, and they can be
        assigned to activities. <b>Collaborators</b> help plan but do not travel (an agent, a parent,
        a friend); they get the same editing rights and are invisible to the itinerary.
        The first person is the owner. Passwords are optional.</div>
      <table class="tbl stack"><thead><tr>
        <th style="width:26%">Name</th><th>On the trip</th><th>Age group</th><th>Access</th>
        <th>Notes / needs</th><th>Password</th><th></th></tr></thead>
      <tbody>
      ${d.travelers.map((v,i)=>`<tr>
        <td data-label="Name"><div class="row"><div class="av sm" style="background:${v.color}">${initials(v.name)}</div>
          <input type="text" class="t-name" data-i="${i}" value="${attr(v.name)}" placeholder="Name"></div></td>
        <td data-label="On the trip"><select class="t-going" data-i="${i}">
          <option value="1" ${v.traveling!==false?'selected':''}>Travelling</option>
          <option value="0" ${v.traveling===false?'selected':''}>Collaborator</option></select></td>
        <td data-label="Age group"><select class="t-kind" data-i="${i}" ${v.traveling===false?'disabled':''}>
          ${['adult','teen','child','senior'].map(k=>`<option value="${k}" ${v.kind===k?'selected':''}>${k}</option>`).join('')}</select></td>
        <td data-label="Access"><select class="t-role" data-i="${i}">
          ${['owner','editor','viewer'].map(k=>`<option value="${k}" ${v.role===k?'selected':''}>${k}</option>`).join('')}</select></td>
        <td data-label="Notes / needs"><input type="text" class="t-notes" data-i="${i}" value="${attr(v.notes)}"
             placeholder="${v.traveling===false?'books the flights':'knee injury, vegetarian…'}"></td>
        <td data-label="Password"><input type="password" class="t-pass" data-i="${i}" value="${attr(v._pw||'')}" placeholder="optional"></td>
        <td>${d.travelers.length>1?`<button class="btn xs danger" data-act="draft-del-traveler" data-i="${i}">✕ Remove</button>`:''}</td>
      </tr>`).join('')}
      </tbody></table>
    </div></div>`;
  }

  if(step===2){
    const c = d.constraints;
    body = `
    <div class="card"><div class="card-h"><h2>How you like to travel</h2></div><div class="card-b col" style="gap:18px">
      <div class="field"><label>Pace</label>
        <div class="seg" id="paceSeg">${Object.entries(PACE).map(([k,v])=>
          `<button data-act="set-pace" data-v="${k}" class="${c.pace===k?'on':''}">${v.label}</button>`).join('')}</div>
        <div class="hint">Relaxed = one anchor a day + siesta · Balanced = two · Packed = three plus evenings.</div>
      </div>
      <div class="field"><label>Interests — tap what matters</label>
        <div class="chips">${INTERESTS.map(x=>
          `<div class="chip ${c.interests.includes(x)?'on':''}" data-act="toggle-interest" data-v="${attr(x)}">${esc(x)}</div>`).join('')}</div>
      </div>
      <div class="grid3">
        <div class="field"><label>Budget</label><select id="f-budget">
          ${[['shoe','Shoestring'],['mid','Mid-range'],['lux','Splurge']].map(([k,l])=>
            `<option value="${k}" ${c.budget===k?'selected':''}>${l}</option>`).join('')}</select></div>
        <div class="field"><label>Mobility</label><select id="f-mobility">
          ${[['none','No limits'],['limited','Limited walking'],['wheelchair','Wheelchair / step-free']].map(([k,l])=>
            `<option value="${k}" ${c.mobility===k?'selected':''}>${l}</option>`).join('')}</select></div>
        <div class="field"><label>Rest day every…</label><select id="f-rest">
          ${[[0,'Never'],[3,'3rd day'],[4,'4th day'],[5,'5th day']].map(([k,l])=>
            `<option value="${k}" ${Number(c.restDayEvery)===k?'selected':''}>${l}</option>`).join('')}</select></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Day starts</label><input type="time" id="f-dayStart" value="${attr(c.dayStart)}" placeholder="">
          <div class="hint">Blank = use the pace default.</div></div>
        <div class="field"><label>Day ends</label><input type="time" id="f-dayEnd" value="${attr(c.dayEnd)}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Must-see list (one per line)</label>
          <textarea id="f-mustSee" placeholder="Fushimi Inari&#10;Nishiki Market">${esc(c.mustSee)}</textarea>
          <div class="hint">These get slotted into full days first.</div></div>
        <div class="field"><label>Avoid / constraints</label>
          <textarea id="f-avoid" placeholder="No long hikes, back home by 9pm, no seafood">${esc(c.avoid)}</textarea></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Dietary needs</label><input type="text" id="f-dietary" value="${attr(c.dietary)}" placeholder="2 vegetarians, 1 nut allergy"></div>
        <div class="field"><label>Currency</label><input type="text" id="f-currency" value="${attr(c.currency)}" placeholder="JPY"></div>
      </div>
    </div></div>`;
  }

  if(step===3){
    const nights = D.isValid(d.flights.outDate)&&D.isValid(d.flights.backDate) ? D.diff(d.flights.outDate,d.flights.backDate) : 0;
    body = `
    <div class="card"><div class="card-h"><h2>Ready to generate</h2></div><div class="card-b">
      <div class="grid2" style="gap:18px">
        <div class="tbl-scroll">
          <table class="tbl">
            <tr><th>Trip</th><td>${esc(d.name||'Untitled')}</td></tr>
            <tr><th>Destination</th><td>${esc(d.destination.label || d.destination.city || '—')}
              ${Geo.valid({lat:d.destination.cityLat,lng:d.destination.cityLng})?'<span class="pill green">pinned</span>':'<span class="pill amber">typed</span>'}</td></tr>
            <tr><th>Stay</th><td>${esc(d.destination.stayLabel || d.destination.stayName || '—')}
              ${Geo.valid(d.destination)?'<span class="pill green">pinned</span>':''}</td></tr>
            <tr><th>Dates</th><td>${D.fmt(d.flights.outDate)} → ${D.fmt(d.flights.backDate)} <span class="muted">(${nights+1} days)</span></td></tr>
            <tr><th>Arrive / leave</th><td>${esc(d.flights.arrTime||'—')} → ${esc(d.flights.backTime||'—')}</td></tr>
            <tr><th>Travellers</th><td>${travellersOf(d).map(v=>esc(v.name)).join(', ')||'—'}</td></tr>
            ${collaboratorsOf(d).length?`<tr><th>Collaborators</th><td>${collaboratorsOf(d).map(v=>esc(v.name)).join(', ')}
              <span class="muted">— not travelling, excluded from the plan</span></td></tr>`:''}
            <tr><th>Pace</th><td>${PACE[d.constraints.pace].label}</td></tr>
            <tr><th>Interests</th><td>${d.constraints.interests.map(esc).join(', ')||'<span class="muted">none set — generic plan</span>'}</td></tr>
          </table>
        </div>
        <div class="card" style="box-shadow:none;background:var(--panel-2)">
          <div class="card-b">
            <h3>What happens next</h3>
            <ul class="small muted" style="padding-left:18px;line-height:1.75;margin:8px 0 0">
              <li><b>Generate with Gemini</b> sends everything above and gets back real, named places
                  for ${esc(d.destination.city||'your destination')} with addresses and local tips.</li>
              <li>Day 1 is planned around your arrival time; the last day around when you leave.</li>
              <li>Travellers' ages, needs, pace and mobility all shape what gets suggested.</li>
              <li><b>Offline draft</b> uses the built-in template engine — no API call, generic titles.</li>
              <li>Nothing is locked. Regenerate a single day or one item later without losing your edits.</li>
            </ul>
          </div>
        </div>
      </div>
    </div></div>`;
  }

  return `${nav}${body}
  <div class="row" style="margin-top:16px">
    <button class="btn ghost" data-act="setup-back">${step===0?'Cancel':'← Back'}</button>
    <div class="spacer"></div>
    ${step<3
      ? `<button class="btn primary" data-act="setup-next">Continue →</button>`
      : `<button class="btn" data-act="setup-blank">Start empty</button>
         <button class="btn" data-act="setup-rules" title="Offline template engine — no API call">Offline draft</button>
         <button class="btn primary" data-act="setup-ai">✨ Generate with Gemini</button>`}
  </div>`;
}

/* ---------------------------- CALENDAR ---------------------------------- */
function viewCalendar(){
  const t = App.trip;
  if(!t.days.length) return `<div class="card"><div class="empty"><div class="big">📅</div>
    <div>No days yet.</div><div style="margin-top:12px"><button class="btn primary" data-act="rebuild">Set up the trip</button></div></div></div>`;

  const first = t.days[0].date, last = t.days[t.days.length-1].date;
  const nAct = t.days.reduce((s,d)=>s+d.activities.length,0);
  const nPhotos = t.days.reduce((s,d)=>s+d.photos.length+d.activities.reduce((x,a)=>x+a.photos.length,0),0);
  const nCmt = t.days.reduce((s,d)=>s+d.comments.length+d.activities.reduce((x,a)=>x+a.comments.length,0),0);

  const header = `
  ${sharedBanner()}
  ${t.isDemo?`<div class="act-instr" style="margin-bottom:12px">
    ⚑ <b>This is the demo trip.</b> Edit anything to see how it works — it is a normal trip.
    Delete it from <b>Trip ⌄ → Delete this trip</b> when you are done, then start your own.</div>`:''}
  <div class="card" style="margin-bottom:16px"><div class="card-b">
    <div class="row wrap">
      <div style="flex:1;min-width:220px">
        <h1>${esc(t.name)}</h1>
        <div class="muted small" style="margin-top:2px">
          ${esc(t.destination.city||'')}${t.destination.country?', '+esc(t.destination.country):''}
          · ${D.fmt(first,'short')} → ${D.fmt(last)} · ${t.days.length} days
          · ${travellersOf(t).length} travelling${collaboratorsOf(t).length?' + '+collaboratorsOf(t).length+' helping':''}</div>
      </div>
      <div class="row wrap" style="gap:14px">
        <div class="center"><div style="font-size:20px;font-weight:700">${nAct}</div><div class="tiny muted">items</div></div>
        <div class="center"><div style="font-size:20px;font-weight:700">${nPhotos}</div><div class="tiny muted">photos</div></div>
        <div class="center"><div style="font-size:20px;font-weight:700">${nCmt}</div><div class="tiny muted">comments</div></div>
        <div class="av-stack">${travellersOf(t).map(v=>`<div class="av" style="background:${v.color}" title="${attr(v.name)}">${initials(v.name)}</div>`).join('')}</div>
        ${collaboratorsOf(t).length?`<div class="av-stack" title="Collaborators — not travelling" style="opacity:.6">
          ${collaboratorsOf(t).map(v=>`<div class="av" style="background:${v.color};box-shadow:inset 0 0 0 2px #fff" title="${attr(v.name)} (collaborator)">${initials(v.name)}</div>`).join('')}</div>`:''}
      </div>
    </div>
    ${t.destination.stayAddress ? `<div class="row small muted" style="margin-top:10px">
      <span>⌂ ${esc(t.destination.stayName||'Stay')} — ${esc(t.destination.stayAddress)}</span>
      <a href="${mapsSearchUrl(t.destination.stayAddress||t.destination.stayName)}" target="_blank" rel="noopener">open in Google Maps ↗</a></div>`:''}
  </div></div>`;

  if(App.calMode==='list' || isPhone()){
    return header +
      `${isPhone()?`<div class="row" style="margin-bottom:10px">
         <div class="seg" style="flex:1">
           <button data-act="go-list" class="${App.calMode!=='month'?'on':''}" style="flex:1">Days</button>
           <button data-act="go-calendar" class="${App.calMode==='month'?'on':''}" style="flex:1">Month</button>
         </div></div>`:''}
       ${App.calMode==='month' && isPhone() ? monthGrids(t) : ''}
       ${App.calMode!=='month' || !isPhone()
         ? `<div class="col" style="gap:12px">${t.days.map(dayListCard).join('')}</div>` : ''}
       ${calFooter(t)}`;
  }

  return header + monthGrids(t) + calFooter(t);
}

function isPhone(){
  try{ return window.matchMedia('(max-width:760px)').matches; }catch(e){ return false; }
}

function calFooter(t){
  return `
    <div class="row wrap" style="margin-top:4px;gap:8px">
      <button class="btn sm primary" data-act="invite">${Cloud.on(t)?'👥 Invite':'👥 Plan together'}</button>
      <button class="btn sm" data-act="ai-trip">✨ Regenerate</button>
      <button class="btn sm" data-act="rebuild">↻ Trip details</button>
      <button class="btn sm" data-act="export-json">⭳ Export</button>
      <button class="btn sm no-mobile" data-act="print">🖨 Print</button>
      <div class="spacer no-mobile"></div>
      <span class="tiny muted">Saved on this device · ${relTime(t.updatedAt)}</span>
    </div>`;
}

function monthGrids(t){
  /* month grid, possibly spanning 2+ months */
  const months = [...new Set(t.days.map(d=>D.monthKey(d.date)))];
  const grids = months.map(mk=>{
    const [y,m] = mk.split('-').map(Number);
    const firstDow = new Date(y,m-1,1).getDay();
    const dim = new Date(y,m,0).getDate();
    const cells=[];
    for(let i=0;i<firstDow;i++) cells.push(null);
    for(let dnum=1;dnum<=dim;dnum++) cells.push(D.fromParts(y,m,dnum));
    while(cells.length%7) cells.push(null);
    return `
    <div class="cal-wrap" style="margin-bottom:16px">
      <div class="card-h"><h3>${D.monthLabel(mk)}</h3><div class="spacer"></div>
        <span class="tiny muted">click a highlighted day to open it</span></div>
      <div class="cal-head">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div>${x}</div>`).join('')}</div>
      <div class="cal-grid">${cells.map(dt=>{
        if(!dt) return `<div class="cal-cell out"></div>`;
        const day = t.days.find(d=>d.date===dt);
        const isToday = dt===D.today();
        if(!day) return `<div class="cal-cell out ${isToday?'today':''}">
          <div class="cal-dnum"><span class="dn">${Number(dt.slice(-2))}</span></div></div>`;
        const items = day.activities.filter(a=>a.type!=='rest').slice(0,4);
        const ph = day.photos.length + day.activities.reduce((s,a)=>s+a.photos.length,0);
        const cm = day.comments.length + day.activities.reduce((s,a)=>s+a.comments.length,0);
        return `<div class="cal-cell trip ${isToday?'today':''}" data-act="open-day" data-id="${day.id}">
          <div class="cal-dnum"><span class="dn">${Number(dt.slice(-2))}</span>
            <span class="tiny muted" style="font-weight:500">${archLabel(day.archetype)}</span></div>
          ${day.title?`<div class="cal-title">${esc(day.title)}</div>`:''}
          <div class="cal-items">${items.map(a=>
            `<div class="cal-item" style="border-color:var(--t-${a.type});background:var(--t-${a.type}-bg)">${esc(a.start)} ${esc(a.title)}</div>`).join('')}
            ${day.activities.length>items.length?`<div class="tiny muted">+${day.activities.length-items.length} more</div>`:''}</div>
          <div class="cal-meta">${ph?`<span>📷 ${ph}</span>`:''}${cm?`<span>💬 ${cm}</span>`:''}</div>
        </div>`;
      }).join('')}</div>
    </div>`;
  }).join('');
  return grids;
}

function archLabel(a){
  return {arrival:'Arrival', departure:'Departure', rest:'Slow day', daytrip:'Day trip', explore:''}[a] ?? '';
}

function dayListCard(day){
  const t=App.trip;
  const ph = day.photos.length + day.activities.reduce((s,a)=>s+a.photos.length,0);
  const cm = day.comments.length + day.activities.reduce((s,a)=>s+a.comments.length,0);
  return `<div class="card" style="cursor:pointer" data-act="open-day" data-id="${day.id}">
    <div class="card-b">
      <div class="row">
        <div style="min-width:96px">
          <div class="tiny muted">${D.fmt(day.date,'dow').split(',')[0]}</div>
          <div style="font-size:19px;font-weight:700">${D.fmt(day.date,'short')}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div class="row"><h3>${esc(day.title||'Untitled day')}</h3>
            ${day.archetype!=='explore'?`<span class="pill blue">${archLabel(day.archetype)}</span>`:''}</div>
          <div class="small muted" style="margin-top:3px">${esc(day.summary||day.activities.map(a=>a.title).slice(0,3).join(' · '))}</div>
        </div>
        <div class="row" style="gap:8px">
          <span class="pill">${day.activities.length} items</span>
          ${ph?`<span class="pill">📷 ${ph}</span>`:''}${cm?`<span class="pill">💬 ${cm}</span>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

/* ------------------------------- DAY ------------------------------------ */
function viewDay(){
  const t=App.trip, day=App.day();
  if(!day) return viewCalendar();
  const idx = t.days.findIndex(d=>d.id===day.id);
  const prev = t.days[idx-1], next = t.days[idx+1];
  const canEdit = Auth.can('edit');
  const acts = [...day.activities]
    .filter(a=>App.filter.type==='all'||a.type===App.filter.type)
    .filter(a=>App.filter.traveler==='all'||!a.assigned.length||a.assigned.includes(App.filter.traveler))
    .sort((a,b)=>T.toMin(a.start)-T.toMin(b.start));
  const totalMins = day.activities.reduce((s,a)=>s+T.dur(a.start,a.end),0);

  const head = `
  ${sharedBanner()}
  <div class="card" style="margin-bottom:16px"><div class="card-b">
    <div class="row wrap">
      <button class="btn sm ghost btn-icon" data-act="open-day" data-id="${prev?prev.id:''}" ${prev?'':'disabled'}>←</button>
      <div style="flex:1;min-width:200px">
        <div class="row"><span class="pill blue">Day ${idx+1} of ${t.days.length}</span>
          ${day.archetype!=='explore'?`<span class="pill">${archLabel(day.archetype)}</span>`:''}
          <span class="tiny muted">${T.durLabel(totalMins)} planned</span></div>
        <h1 style="margin-top:6px">${esc(day.title||D.fmt(day.date,'long'))}</h1>
        <div class="muted small">${D.fmt(day.date,'long')}</div>
      </div>
      <button class="btn sm ghost btn-icon" data-act="open-day" data-id="${next?next.id:''}" ${next?'':'disabled'}>→</button>
    </div>
    <div class="row wrap" style="margin-top:12px">
      ${canEdit?`<button class="btn sm primary" data-act="add-activity">+ Add item</button>`:''}
      ${canEdit?`<button class="btn sm" data-act="edit-day">Edit day</button>`:''}
      ${canEdit?`<button class="btn sm" data-act="ai-day">✨ Regenerate day</button>`:''}
      ${canEdit?`<button class="btn sm" data-act="copy-day">⧉ Copy this plan</button>`:''}
      ${canEdit?`<button class="btn sm" data-act="clear-day">Clear day</button>`:''}
      <div class="spacer"></div>
      <select id="filterType" style="width:auto"><option value="all">All types</option>
        ${Object.entries(ACT_TYPES).map(([k,v])=>`<option value="${k}" ${App.filter.type===k?'selected':''}>${v.label}</option>`).join('')}</select>
      <select id="filterTrav" style="width:auto"><option value="all">Everyone</option>
        ${travellersOf(t).map(v=>`<option value="${v.id}" ${App.filter.traveler===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select>
    </div>
    ${day.instructions?`<div class="act-instr" style="margin-top:12px"><b>Day notes:</b> ${esc(day.instructions)}</div>`:''}
  </div></div>`;

  const rows = [];
  acts.forEach((a,i)=>{
    rows.push(activityRow(a,i,canEdit));
    const next = acts[i+1];
    if(next){ const h = Geo.hop(a, next); if(h) rows.push(hopRow(a, next, h)); }
  });
  const timeline = acts.length ? `<div class="timeline">${rows.join('')}</div>`
    : `<div class="card"><div class="empty"><div class="big">🗓</div><div>Nothing planned for this day.</div>
        ${canEdit?`<div style="margin-top:12px"><button class="btn primary" data-act="add-activity">+ Add the first item</button>
        <button class="btn" data-act="copy-day-from">Copy from another day</button></div>`:''}</div></div>`;

  return head + `<div class="day-layout">
    <div>${timeline}
      ${acts.length&&canEdit?`<div class="row" style="margin-top:10px">
        <button class="btn sm" data-act="add-activity">+ Add item</button>
        <button class="btn sm ghost" data-act="copy-day-from">Copy from another day</button></div>`:''}
    </div>
    <div class="sticky-side col" style="gap:14px">
      ${sidePlaces(day)}
      ${sidePhotos(day)}
      ${sideComments(day)}
    </div>
  </div>`;
}

function hopRow(from, to, h){
  const cls = h.impossible ? 'bad' : h.tight ? 'tight' : '';
  const note = h.impossible ? ' · overlaps the previous item'
             : h.tight ? ' · only ' + h.gap + ' min gap' : '';
  return `<div class="tl-item hop">
    <div class="tl-time">↓</div>
    <div class="tl-body">

/* --------------------------- maps url helpers --------------------------- */
function mapsSearchUrl(q){
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q||'');
}
function mapsRouteUrl(stops){
  const pts = stops.map(a => Geo.valid(a.place) ? (a.place.lat + ',' + a.place.lng)
                                                : (a.place.address || a.place.name)).filter(Boolean);
  if(pts.length<2) return mapsSearchUrl(pts[0]||'');
  const origin=encodeURIComponent(pts[0]), dest=encodeURIComponent(pts[pts.length-1]);
  const way = pts.slice(1,-1).map(encodeURIComponent).join('%7C');
  return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}${way?`&waypoints=${way}`:''}&travelmode=walking`;
}

/* ============================== §8 MODALS ================================ */
const Modal = {
  stack:[],
  open({title, body, footer, wide, narrow, onMount}){
    const id = uid('m');
    const el = document.createElement('div');
    el.className='modal-bg'; el.dataset.modal=id;
    el.innerHTML = `<div class="modal ${wide?'wide':''} ${narrow?'narrow':''}">
      <div class="modal-h"><h2 style="flex:1">${title}</h2>
        <button class="btn sm ghost btn-icon" data-act="modal-close">✕</button></div>
      <div class="modal-b">${body}</div>
      ${footer!==null?`<div class="modal-f">${footer||'<button class="btn" data-act="modal-close">Close</button>'}</div>`:''}
    </div>`;
    el.addEventListener('mousedown', e=>{ if(e.target===el) Modal.close(); });
    $('#modalHost').appendChild(el);
    this.stack.push(id);
    if(onMount) onMount(el);
    return el;
  },
  close(){
    const id=this.stack.pop(); if(!id) return;
    const el=$(`[data-modal="${id}"]`); if(el) el.remove();
  },
  closeAll(){ while(this.stack.length) this.close(); }
};

async function saveActivityFromModal(actId){
  const el = $(`[data-modal="${Modal.stack[Modal.stack.length-1]}"]`);
  if(!el) return;
  const d = el._draft;
  const g = s => el.querySelector(s)?.value ?? '';
  const patch = {
    title: g('#a-title').trim() || 'Untitled item',
    type: g('#a-type'), start: g('#a-start')||'09:00', end: g('#a-end')||'10:00',
    currency: g('#a-cur'), cost: g('#a-cost'),
    place: (function(){
      const name = g('#a-placeName').trim(), address = g('#a-placeAddr').trim();
      const typed = g('#a-latlng').trim();
      const prefill = Geo.valid(d.place)
        ? d.place.lat.toFixed(5) + ', ' + d.place.lng.toFixed(5) : '';
      const placeChanged = (address !== d.place.address) || (name !== d.place.name);
      let lat = null, lng = null;
      if(typed && !(placeChanged && typed === prefill)){
        // explicit coordinates win, unless they are stale leftovers of a place
        // the user just renamed - in that case drop them rather than mislead
        const m = typed.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
        if(m && Math.abs(+m[1]) <= 90 && Math.abs(+m[2]) <= 180){ lat = +m[1]; lng = +m[2]; }
      }
      return Object.assign({}, d.place, {name, address, lat, lng});
    })(),
    notes: g('#a-notes'), instructions: g('#a-instr'),
    booking: Object.assign({}, d.booking, {ref:g('#a-bref').trim(), url:g('#a-burl').trim()}),
    assigned: d.assigned
  };
  if(T.toMin(patch.end) <= T.toMin(patch.start)) patch.end = T.add(patch.start, 60);
  const day = App.day();
  if(actId){
    const a = day.activities.find(x=>x.id===actId);
    Object.assign(a, patch);
    logAction(App.trip,'edit-item',`${a.title} · ${D.fmt(day.date,'short')}`);
  } else {
    const a = newActivity(Object.assign({createdBy:App.me()?.id}, patch));
    a.place = patch.place; day.activities.push(a);
    logAction(App.trip,'add-item',`${a.title} · ${D.fmt(day.date,'short')}`);
  }
  day.activities.sort((x,y)=>T.toMin(x.start)-T.toMin(y.start));
  day.summary = summaryFor(day);
  Modal.close();
  await App.saveAndRender();
  toast('Saved','good');
}

async function doCopy(direction){
  const el = $(`[data-modal="${Modal.stack[Modal.stack.length-1]}"]`);
  const t=App.trip, day=App.day();
  const mode = el.querySelector('#copyMode .on')?.dataset.copymode || 'replace';
  const withMedia = el.querySelector('#copyPhotos')?.checked;
  const picked = Array.from(el.querySelectorAll('.copyTarget:checked')).map(x=>x.value);
  if(!picked.length){ toast('Pick at least one day','bad'); return; }

  const clone = (src)=> src.map(a=>{
    const c = JSON.parse(JSON.stringify(a));
    c.id = uid('act'); c.done=false; c.source='copied';
    if(!withMedia){ c.photos=[]; c.comments=[]; }
    return c;
  });

  if(direction==='from'){
    const src = t.days.find(d=>d.id===picked[0]);
    day.activities = mode==='replace' ? clone(src.activities) : day.activities.concat(clone(src.activities));
    if(mode==='replace'){ day.title = src.title; day.archetype = src.archetype; day.instructions = src.instructions; }
    if(withMedia){ day.photos = mode==='replace' ? [...src.photos] : day.photos.concat(src.photos); }
    day.activities.sort((a,b)=>T.toMin(a.start)-T.toMin(b.start));
    day.summary = summaryFor(day);
    logAction(t,'copy-in',`from ${D.fmt(src.date,'short')}`);
  } else {
    picked.forEach(id=>{
      const tgt = t.days.find(d=>d.id===id);
      tgt.activities = mode==='replace' ? clone(day.activities) : tgt.activities.concat(clone(day.activities));
      if(mode==='replace'){ tgt.title = day.title; tgt.archetype = day.archetype; tgt.instructions = day.instructions; }
      if(withMedia){ tgt.photos = mode==='replace' ? [...day.photos] : tgt.photos.concat(day.photos); }
      tgt.activities.sort((a,b)=>T.toMin(a.start)-T.toMin(b.start));
      tgt.summary = summaryFor(tgt);
    });
    logAction(t,'copy-out',`to ${picked.length} day(s)`);
  }
  Modal.close();
  await App.saveAndRender();
  toast(`Copied to ${picked.length} day${picked.length>1?'s':''}`,'good');
}
